<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TruthGuard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* Custom Styling to match the React/Tailwind design */
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            width: 100%;
            max-width: 450px;
        }

        /* Icon Container (Shield) */
        .icon-circle {
            background-color: rgba(13, 110, 253, 0.1); /* bg-primary/10 */
            border-radius: 0.75rem;
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .icon-circle i {
            color: #0d6efd; /* text-primary */
            font-size: 2rem;
        }

        /* Custom Input Groups to look like the React inputs */
        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d; /* text-muted-foreground */
            z-index: 5;
            pointer-events: none;
        }

        .custom-input {
            height: 3rem; /* h-12 */
            padding-left: 2.5rem; /* Space for icon */
            border-radius: 0.375rem;
        }

        /* Button Styling */
        .btn-custom {
            height: 3rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Error Message */
        .error-box {
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            font-size: 0.875rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.25rem;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    
    <!-- Navbar Component -->
    <nav class="navbar-custom">
        <div class="container navbar-content">
            
            <!-- 1. Logo -->
            <a href="/" class="logo-link">
                <div class="logo-icon-box">
                    <i class="bi bi-shield-check text-dark"></i>
                </div>
                <span class="fw-bold fs-5">TruthGuard</span>
            </a>

            <!-- 2. Desktop Navigation (Hidden on Mobile) -->
            <div class="d-none d-md-flex align-items-center gap-4">
                <a href="/" class="nav-link-custom active">Home</a>
                <a href="{% url 'predictions_list' %}" class="nav-link-custom">All Predictions</a>
            </div>

            <!-- 3. Auth Section (Hidden on Mobile) -->
            <div class="d-none d-md-flex align-items-center gap-3" id="desktopAuthSection">
                <!-- Javascript will populate this based on state -->
            </div>

            <!-- 4. Mobile Menu Button -->
            <button class="btn btn-ghost-custom d-md-none p-2" id="mobileMenuBtn">
                <i class="bi bi-list fs-5" id="mobileMenuIcon"></i>
            </button>
        </div>

        <!-- 5. Mobile Menu Dropdown -->
        <div class="container mobile-menu" id="mobileMenu">
            <div class="d-flex flex-column gap-2">
                <a href="/" class="mobile-nav-link active">Home</a>
                <a href="{% url 'predictions_list' %}" class="mobile-nav-link">All Predictions</a>
                
                <!-- Mobile Auth Section -->
                <div class="border-top pt-3 mt-2" id="mobileAuthSection">
                    <!-- Javascript will populate this -->
                </div>
            </div>
        </div>
    </nav>

    <div class="container px-4">
        <div class="d-flex justify-content-center">
            <div class="login-card">
                
                <!-- Header Section -->
                <div class="text-center mb-4">
                    <div class="icon-circle">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-2">Welcome Back</h1>
                    <p class="text-muted">Sign in to your TruthGuard account</p>
                </div>

                <!-- Form Section -->
                <!-- Form Section -->
                <form id="loginForm" method="POST" action="">
                    {% csrf_token %}
                    <!-- Error Alert -->
                    {% if error %}
                    <div class="error-box" style="display: block;">
                        {{ error }}
                    </div>
                    {% endif %}
                    
                    <div id="clientError" class="error-box"></div>

                    <!-- Email Input -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium small">Email</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" class="form-control custom-input" id="email" name="email"
                                   placeholder="you@example.com" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium small">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" class="form-control custom-input" id="password" name="password"
                                   placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 btn-custom" id="submitBtn">
                        <span id="btnText">Sign In</span>
                        <div id="btnLoader" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </form>

                <!-- Footer/Links -->
                <p class="text-center text-muted small mt-4">
                    Don't have an account? 
                    <a href="{% url 'signup' %}" class="text-primary text-decoration-none fw-medium">Create one</a>
                </p>

                <div class="mt-4 pt-4 border-top">
                    <p class="text-center text-muted" style="font-size: 0.75rem;">
                        <strong>Demo:</strong> Use "admin@example.com" to login as admin
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const clientError = document.getElementById('clientError');

            // Handle Submit
            loginForm.addEventListener('submit', function(e) {
                // Allow natural submission
                // e.preventDefault();

                // Reset State
                if(clientError) clientError.style.display = 'none';
                submitBtn.disabled = true;
                btnText.textContent = 'Signing in...';
                btnLoader.classList.remove('d-none');
            });
        });
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Navbar Logic -->
    <script>
    (function() {
         // --- State Management ---
         const navState = {
            isAuthenticated: false, // Update this based on real auth
            mobileMenuOpen: false,
            user: {
                username: 'demo_user',
                isAdmin: true 
            }
        };

        // --- DOM Elements ---
        const desktopAuthContainer = document.getElementById('desktopAuthSection');
        const mobileAuthContainer = document.getElementById('mobileAuthSection');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenuIcon = document.getElementById('mobileMenuIcon');

        // --- Render Functions ---
        function renderNavbar() {
            // Check if we can sync with main page state if available
            // For Login page, we might want to default to 'Guest' unless there's a specific requirement
           
            // Render Desktop Auth
            if (navState.isAuthenticated) {
                // ... same login view logic ...
            } else {
                // Guest View
                const guestHtml = `
                    <a href="{% url 'login' %}" class="btn btn-ghost-custom btn-sm">Login</a>
                    <a href="{% url 'signup' %}" class="btn btn-default-custom btn-sm">Sign Up</a>
                `;
                desktopAuthContainer.innerHTML = guestHtml;

                // Mobile Guest View
                mobileAuthContainer.innerHTML = `
                    <div class="d-flex gap-2">
                        <a href="{% url 'login' %}" class="btn btn-ghost-custom flex-grow-1">Login</a>
                        <a href="{% url 'signup' %}" class="btn btn-default-custom flex-grow-1">Sign Up</a>
                    </div>
                `;
            }
        }

        // --- Event Handlers ---
        function toggleMobileMenu() {
            navState.mobileMenuOpen = !navState.mobileMenuOpen;
            
            if (navState.mobileMenuOpen) {
                mobileMenu.classList.add('open');
                mobileMenuIcon.classList.remove('bi-list');
                mobileMenuIcon.classList.add('bi-x-lg');
            } else {
                mobileMenu.classList.remove('open');
                mobileMenuIcon.classList.remove('bi-x-lg');
                mobileMenuIcon.classList.add('bi-list');
            }
        }

        window.handleLogout = function() {
            alert('Logged out');
            window.location.href = '/';
        };

        if(mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        }

        // Initial Render
        renderNavbar();
    })();
    </script>
</body>
</html>
