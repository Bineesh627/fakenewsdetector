<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provide Feedback - TruthGuard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* --- Base Styles & Variables --- */
        :root {
            --foreground: #f8fafc;
            --muted-foreground: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(59, 130, 246, 0.3);
            --primary: #3b82f6;
            --success: #22c55e;
            --destructive: #ef4444;
            --secondary-bg: rgba(15, 23, 42, 0.6);
        }

        body {
            background-color: transparent;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--foreground);
            min-height: 100vh;
        }

        /* --- Utilities --- */
        .text-muted-foreground { color: var(--muted-foreground) !important; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        
        /* --- Animation --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* --- Components --- */
        .btn-outline-custom {
            border: 1px solid var(--border-color);
            color: var(--foreground);
            background: transparent;
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border-radius: 0.5rem;
            transition: background 0.2s;
        }
        .btn-outline-custom:hover {
            background-color: var(--secondary-bg);
            color: var(--foreground);
        }

        .prediction-summary-box {
            background-color: rgba(15, 23, 42, 0.6); /* dark bg */
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem;
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        /* Form Controls */
        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #93c5fd;
            text-transform: uppercase;
            font-family: monospace;
            letter-spacing: 0.05em;
        }

        .form-select-custom, .form-control-custom {
            border-color: rgba(71, 85, 105, 0.8);
            background-color: rgba(15, 23, 42, 0.8);
            color: white;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            border-radius: 0.375rem;
            font-family: monospace;
        }
        .form-select-custom:focus, .form-control-custom:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
            color: white;
        }
        
        .form-control-custom::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 0.75rem;
            font-weight: 500;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
        }
        .btn-submit:hover {
            background-color: #1e293b;
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Success View */
        .success-icon-circle {
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            background-color: rgba(22, 163, 74, 0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .success-icon-circle i {
            color: var(--success);
            font-size: 2.5rem;
        }

        /* Toast Styling */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1050;
        }
    </style>
</head>
<body class="bg-transparent text-slate-200" style="min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Futuristic Animated Background (Vanta.js Net) -->
    <div id="vanta-bg" class="fixed inset-0" style="z-index: -20;"></div>
    <div class="fixed inset-0 bg-slate-900/60 pointer-events-none" style="z-index: -10;"></div>

    <!-- Navbar Component -->
    <!-- Navbar Component -->
    {% include 'users/UserNavbar.html' %}

    <div class="container py-5">
        <div id="app-root" class="mx-auto" style="max-width: 672px;"> <!-- max-w-2xl -->
            <!-- Content Injected Here -->
            <div class="text-center py-5">
                <div class="spinner-border text-secondary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container">
        <div id="successToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <strong>Feedback Submitted</strong><br>
                    Thank you for helping improve our model!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Mock Data ---
        // --- Real Data from Backend ---
        const rawPredictions = JSON.parse("{{ predictions_json|escapejs }}");
        const mockPredictions = rawPredictions.map(p => ({
            ...p,
            createdAt: new Date(p.createdAt)
        }));

        // --- State Management ---
        let currentPrediction = null;

        document.addEventListener('DOMContentLoaded', () => {
            const appRoot = document.getElementById('app-root');
            
            // 1. Get ID from backend context or URL (here we use the injected one)
            // The view only sends one prediction in the list
            const id = "{{ pred_id }}";

            // 2. Find Prediction
            // 2. Find Prediction
            currentPrediction = mockPredictions[0]; // Since we filter on backend

            // 3. Render Initial State
            if (!currentPrediction) {
                renderNotFound(appRoot);
            } else {
                renderForm(appRoot);
            }
        });

        // --- Render Functions ---

        function renderNotFound(container) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <h1 class="h3 fw-bold mb-3">Prediction Not Found</h1>
                    <a href="/predictions" class="btn-outline-custom">
                        <i class="bi bi-arrow-left me-2"></i> Back to Predictions
                    </a>
                </div>
            `;
        }

        function renderForm(container) {
            const isReal = currentPrediction.prediction === 'Real';
            const colorClass = isReal ? 'text-success' : 'text-destructive';
            const confidence = Math.round(currentPrediction.confidence * 100);
            
            // Default corrected label is opposite of prediction
            const defaultCorrected = isReal ? 'Fake' : 'Real';

            container.innerHTML = `
                <!-- Back Link -->
                <a href="/prediction/${currentPrediction.id}" class="text-decoration-none text-blue-400 hover:text-blue-300 d-inline-flex align-items-center mb-4 small font-monospace text-uppercase transition-colors">
                    <i class="bi bi-arrow-left me-2"></i> Back to prediction
                </a>

                <!-- Header -->
                <div class="mb-4">
                    <h1 class="h3 fw-bold mb-2 text-white font-monospace text-uppercase" style="text-shadow: 0 0 15px rgba(59,130,246,0.3);">Provide Feedback</h1>
                    <p class="text-blue-200 opacity-75 small font-monospace">Help us improve the model by providing the correct label for this article.</p>
                </div>

                <!-- Summary Box -->
                <div class="prediction-summary-box mb-4 shadow-[0_0_15px_rgba(59,130,246,0.1)]">
                    <p class="small text-blue-400 mb-2 font-monospace text-uppercase tracking-wider"><i class="bi bi-cpu me-1"></i> Original Prediction</p>
                    <p class="mb-2 text-truncate text-slate-300 font-monospace small" style="max-width: 100%;">${currentPrediction.text}</p>
                    <p class="small mb-0 font-monospace text-slate-400">
                        Predicted as 
                        <span class="${colorClass} fw-bold"> [ ${currentPrediction.prediction} ] </span>
                        with ${confidence}% confidence
                    </p>
                </div>

                <!-- Form -->
                <div class="form-card">
                    <form id="feedbackForm">
                        
                        <!-- Label Select -->
                        <div class="mb-4">
                            <label class="form-label"><i class="bi bi-sliders me-1"></i> What is the correct label?</label>
                            <select class="form-select form-select-custom" id="correctedLabel">
                                <option value="Real" ${defaultCorrected === 'Real' ? 'selected' : ''}>Real - This news is authentic</option>
                                <option value="Fake" ${defaultCorrected === 'Fake' ? 'selected' : ''}>Fake - This news is misinformation</option>
                            </select>
                        </div>

                        <!-- Notes Textarea -->
                        <div class="mb-4">
                            <label for="note" class="form-label"><i class="bi bi-terminal me-1"></i> Additional Notes (Optional)</label>
                            <textarea class="form-control form-control-custom" id="note" rows="4" 
                                placeholder="Why do you think the prediction is wrong? Any sources to verify?"></textarea>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn-submit bg-blue-600 hover:bg-blue-500 border border-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.4)] text-uppercase font-monospace tracking-wider transition-all" id="submitBtn">
                            <i class="bi bi-send-fill" style="font-size: 0.875rem;"></i>
                            <span>Submit Correction</span>
                            <div class="spinner-border spinner-border-sm text-light ms-2 d-none" id="btnSpinner" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </form>
                </div>
            `;

            // Attach Listener
            document.getElementById('feedbackForm').addEventListener('submit', handleFormSubmit);
        }

        function renderSuccess(container) {
            container.innerHTML = `
                <div class="text-center py-5 animate-fade-in">
                    <div class="success-icon-circle bg-green-900/40 border border-green-500/50 shadow-[0_0_20px_rgba(34,197,94,0.3)]">
                        <i class="bi bi-check-circle-fill text-green-400"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-2 text-white font-monospace text-uppercase">Thank You!</h1>
                    <p class="text-blue-200 opacity-75 mb-4 font-monospace">Your feedback has been submitted and will help improve our model.</p>
                    <a href="/predictions" class="btn btn-primary bg-blue-600 border border-blue-400 px-4 py-2 font-monospace text-uppercase text-sm shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:bg-blue-500 transition-colors">View All Predictions</a>
                </div>
            `;
        }

        // --- Logic Handlers ---

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = submitBtn.querySelector('span');
            const icon = submitBtn.querySelector('i');

            // 1. Loading State
            submitBtn.disabled = true;
            icon.classList.add('d-none');
            btnText.textContent = 'Submitting...';
            btnSpinner.classList.remove('d-none');

            // 2. Perform Fetch to Backend
            try {
                const formData = new FormData();
                formData.append('corrected_label', document.getElementById('correctedLabel').value);
                formData.append('feedback_note', document.getElementById('note').value);
                formData.append('csrfmiddlewaretoken', '{{ csrf_token }}'); // Add CSRF

                const response = await fetch(window.location.href, {
                    method: 'POST',
                    body: formData
                });
                
                if(!response.ok) throw new Error('Submission failed');
                
            } catch(e) {
                console.error(e);
                alert('Error submitting feedback');
                // resetting state
                submitBtn.disabled = false;
                icon.classList.remove('d-none');
                btnText.textContent = 'Submit Correction';
                btnSpinner.classList.add('d-none');
                return;
            }

            // 3. Show Toast
            const toastEl = document.getElementById('successToast');
            const toast = new bootstrap.Toast(toastEl);
            toast.show();

            // 4. Update UI to Success View
            const appRoot = document.getElementById('app-root');
            renderSuccess(appRoot);

            // 5. Simulate Navigation (Optional)
            setTimeout(() => {
                console.log('Navigating to predictions list...');
                // window.location.href = '/predictions'; 
            }, 2000);
        }

    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Vanta.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x0f172a,
            points: 12.00,
            maxDistance: 22.00,
            spacing: 18.00,
            showDots: true
        });
    </script>
</body>
</html>
