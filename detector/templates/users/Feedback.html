<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provide Feedback - TruthGuard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* --- Base Styles & Variables --- */
        :root {
            --foreground: #0f172a;
            --muted-foreground: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary: #0f172a;
            --success: #16a34a;
            --destructive: #dc2626;
            --secondary-bg: #f1f5f9;
        }

        body {
            background-color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--foreground);
            min-height: 100vh;
        }

        /* --- Utilities --- */
        .text-muted-foreground { color: var(--muted-foreground) !important; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        
        /* --- Animation --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* --- Components --- */
        .btn-outline-custom {
            border: 1px solid var(--border-color);
            color: var(--foreground);
            background: transparent;
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border-radius: 0.5rem;
            transition: background 0.2s;
        }
        .btn-outline-custom:hover {
            background-color: var(--secondary-bg);
            color: var(--foreground);
        }

        .prediction-summary-box {
            background-color: rgba(241, 245, 249, 0.5); /* secondary/50 */
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem;
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Form Controls */
        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-select-custom, .form-control-custom {
            border-color: var(--border-color);
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            border-radius: 0.375rem;
        }
        .form-select-custom:focus, .form-control-custom:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.1);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 0.75rem;
            font-weight: 500;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
        }
        .btn-submit:hover {
            background-color: #1e293b;
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Success View */
        .success-icon-circle {
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            background-color: rgba(22, 163, 74, 0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .success-icon-circle i {
            color: var(--success);
            font-size: 2.5rem;
        }

        /* Toast Styling */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1050;
        }
    </style>
</head>
<body>

    <!-- Navbar Component -->
    <nav class="navbar-custom">
        <div class="container navbar-content">
            
            <!-- 1. Logo -->
            <a href="/" class="logo-link">
                <div class="logo-icon-box">
                    <i class="bi bi-shield-check text-dark"></i>
                </div>
                <span class="fw-bold fs-5">TruthGuard</span>
            </a>

            <!-- 2. Desktop Navigation (Hidden on Mobile) -->
            <div class="d-none d-md-flex align-items-center gap-4">
                <a href="/" class="nav-link-custom active">Home</a>
                <a href="{% url 'predictions_list' %}" class="nav-link-custom">All Predictions</a>
            </div>

            <!-- 3. Auth Section (Hidden on Mobile) -->
            <div class="d-none d-md-flex align-items-center gap-3" id="desktopAuthSection">
                <!-- Javascript will populate this based on state -->
            </div>

            <!-- 4. Mobile Menu Button -->
            <button class="btn btn-ghost-custom d-md-none p-2" id="mobileMenuBtn">
                <i class="bi bi-list fs-5" id="mobileMenuIcon"></i>
            </button>
        </div>

        <!-- 5. Mobile Menu Dropdown -->
        <div class="container mobile-menu" id="mobileMenu">
            <div class="d-flex flex-column gap-2">
                <a href="/" class="mobile-nav-link active">Home</a>
                <a href="{% url 'predictions_list' %}" class="mobile-nav-link">All Predictions</a>
                
                <!-- Mobile Auth Section -->
                <div class="border-top pt-3 mt-2" id="mobileAuthSection">
                    <!-- Javascript will populate this -->
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div id="app-root" class="mx-auto" style="max-width: 672px;"> <!-- max-w-2xl -->
            <!-- Content Injected Here -->
            <div class="text-center py-5">
                <div class="spinner-border text-secondary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container">
        <div id="successToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <strong>Feedback Submitted</strong><br>
                    Thank you for helping improve our model!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Mock Data ---
        // --- Real Data from Backend ---
        const rawPredictions = JSON.parse("{{ predictions_json|escapejs }}");
        const mockPredictions = rawPredictions.map(p => ({
            ...p,
            createdAt: new Date(p.createdAt)
        }));

        // --- State Management ---
        let currentPrediction = null;

        document.addEventListener('DOMContentLoaded', () => {
            const appRoot = document.getElementById('app-root');
            
            // 1. Get ID from backend context or URL (here we use the injected one)
            // The view only sends one prediction in the list
            const id = "{{ pred_id }}";

            // 2. Find Prediction
            // 2. Find Prediction
            currentPrediction = mockPredictions[0]; // Since we filter on backend

            // 3. Render Initial State
            if (!currentPrediction) {
                renderNotFound(appRoot);
            } else {
                renderForm(appRoot);
            }
        });

        // --- Render Functions ---

        function renderNotFound(container) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <h1 class="h3 fw-bold mb-3">Prediction Not Found</h1>
                    <a href="/predictions" class="btn-outline-custom">
                        <i class="bi bi-arrow-left me-2"></i> Back to Predictions
                    </a>
                </div>
            `;
        }

        function renderForm(container) {
            const isReal = currentPrediction.prediction === 'Real';
            const colorClass = isReal ? 'text-success' : 'text-destructive';
            const confidence = Math.round(currentPrediction.confidence * 100);
            
            // Default corrected label is opposite of prediction
            const defaultCorrected = isReal ? 'Fake' : 'Real';

            container.innerHTML = `
                <!-- Back Link -->
                <a href="/prediction/${currentPrediction.id}" class="text-decoration-none text-muted-foreground d-inline-flex align-items-center mb-4 small">
                    <i class="bi bi-arrow-left me-2"></i> Back to prediction
                </a>

                <!-- Header -->
                <div class="mb-4">
                    <h1 class="h3 fw-bold mb-2">Provide Feedback</h1>
                    <p class="text-muted-foreground">Help us improve the model by providing the correct label for this article.</p>
                </div>

                <!-- Summary Box -->
                <div class="prediction-summary-box mb-4">
                    <p class="small text-muted-foreground mb-2">Original Prediction</p>
                    <p class="mb-2 text-truncate" style="max-width: 100%;">${currentPrediction.text}</p>
                    <p class="small mb-0">
                        Predicted as 
                        <span class="${colorClass} fw-semibold">${currentPrediction.prediction}</span>
                        with ${confidence}% confidence
                    </p>
                </div>

                <!-- Form -->
                <div class="form-card">
                    <form id="feedbackForm">
                        
                        <!-- Label Select -->
                        <div class="mb-4">
                            <label class="form-label">What is the correct label?</label>
                            <select class="form-select form-select-custom" id="correctedLabel">
                                <option value="Real" ${defaultCorrected === 'Real' ? 'selected' : ''}>Real - This news is authentic</option>
                                <option value="Fake" ${defaultCorrected === 'Fake' ? 'selected' : ''}>Fake - This news is misinformation</option>
                            </select>
                        </div>

                        <!-- Notes Textarea -->
                        <div class="mb-4">
                            <label for="note" class="form-label">Additional Notes (Optional)</label>
                            <textarea class="form-control form-control-custom" id="note" rows="4" 
                                placeholder="Why do you think the prediction is wrong? Any sources to verify?"></textarea>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn-submit" id="submitBtn">
                            <i class="bi bi-send-fill" style="font-size: 0.875rem;"></i>
                            <span>Submit Correction</span>
                            <div class="spinner-border spinner-border-sm text-light ms-2 d-none" id="btnSpinner" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </form>
                </div>
            `;

            // Attach Listener
            document.getElementById('feedbackForm').addEventListener('submit', handleFormSubmit);
        }

        function renderSuccess(container) {
            container.innerHTML = `
                <div class="text-center py-5 animate-fade-in">
                    <div class="success-icon-circle">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-2">Thank You!</h1>
                    <p class="text-muted-foreground mb-4">Your feedback has been submitted and will help improve our model.</p>
                    <a href="/predictions" class="btn btn-dark px-4 py-2">View All Predictions</a>
                </div>
            `;
        }

        // --- Logic Handlers ---

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = submitBtn.querySelector('span');
            const icon = submitBtn.querySelector('i');

            // 1. Loading State
            submitBtn.disabled = true;
            icon.classList.add('d-none');
            btnText.textContent = 'Submitting...';
            btnSpinner.classList.remove('d-none');

            // 2. Perform Fetch to Backend
            try {
                const formData = new FormData();
                formData.append('corrected_label', document.getElementById('correctedLabel').value);
                formData.append('feedback_note', document.getElementById('note').value);
                formData.append('csrfmiddlewaretoken', '{{ csrf_token }}'); // Add CSRF

                const response = await fetch(window.location.href, {
                    method: 'POST',
                    body: formData
                });
                
                if(!response.ok) throw new Error('Submission failed');
                
            } catch(e) {
                console.error(e);
                alert('Error submitting feedback');
                // resetting state
                submitBtn.disabled = false;
                icon.classList.remove('d-none');
                btnText.textContent = 'Submit Correction';
                btnSpinner.classList.add('d-none');
                return;
            }

            // 3. Show Toast
            const toastEl = document.getElementById('successToast');
            const toast = new bootstrap.Toast(toastEl);
            toast.show();

            // 4. Update UI to Success View
            const appRoot = document.getElementById('app-root');
            renderSuccess(appRoot);

            // 5. Simulate Navigation (Optional)
            setTimeout(() => {
                console.log('Navigating to predictions list...');
                // window.location.href = '/predictions'; 
            }, 2000);
        }

    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Navbar Logic -->
    <script>
    (function() {
         // --- State Management ---
         const navState = {
            isAuthenticated: "{{ user.is_authenticated|yesno:'true,false' }}" === "true",
            mobileMenuOpen: false,
            user: {
                username: "{{ user.username|escapejs }}",
                isAdmin: "{{ user.is_staff|yesno:'true,false' }}" === "true"
            }
        };

        // --- DOM Elements ---
        const desktopAuthContainer = document.getElementById('desktopAuthSection');
        const mobileAuthContainer = document.getElementById('mobileAuthSection');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenuIcon = document.getElementById('mobileMenuIcon');

        // --- Render Functions ---
        function renderNavbar() {
            // Check if we can sync with main page state if available
            if (typeof state !== 'undefined' && state.isAuthenticated !== undefined) {
                navState.isAuthenticated = state.isAuthenticated;
                if(state.user) navState.user = state.user;
            }

            // Render Desktop Auth
            if (navState.isAuthenticated) {
                // Logged In View
                const adminLink = navState.user.isAdmin 
                    ? `<a href="/admin" class="btn btn-outline-custom btn-sm">Admin Panel</a>` 
                    : '';

                const authHtml = `
                    <div class="d-flex align-items-center gap-2 text-sm text-muted" style="font-size: 0.875rem;">
                        <i class="bi bi-person text-secondary"></i>
                        <span class="fw-medium text-dark">${navState.user.username}</span>
                    </div>
                    ${adminLink}
                    <button class="btn btn-ghost-custom btn-sm" onclick="handleLogout()">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                `;
                desktopAuthContainer.innerHTML = authHtml;
                
                // Mobile Auth View
                mobileAuthContainer.innerHTML = `
                    <div class="d-flex align-items-center gap-2 mb-3 text-sm">
                        <i class="bi bi-person text-secondary"></i>
                        <span class="fw-medium">${navState.user.username}</span>
                    </div>
                    ${navState.user.isAdmin ? `
                        <a href="/admin" class="btn btn-outline-custom w-100 mb-2">Admin Panel</a>
                    ` : ''}
                    <button class="btn btn-ghost-custom w-100 text-start ps-0" onclick="handleLogout()">
                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </button>
                    <!-- Actual Logout Form for Django -->
                    <form id="logoutForm" action="{% url 'logout' %}" method="post" style="display:none">{% csrf_token %}</form>
                `;

            } else {
                // Guest View
                const guestHtml = `
                    <a href="{% url 'login' %}" class="btn btn-ghost-custom btn-sm">Login</a>
                    <a href="{% url 'signup' %}" class="btn btn-default-custom btn-sm">Sign Up</a>
                `;
                desktopAuthContainer.innerHTML = guestHtml;

                // Mobile Guest View
                mobileAuthContainer.innerHTML = `
                    <div class="d-flex gap-2">
                        <a href="{% url 'login' %}" class="btn btn-ghost-custom flex-grow-1">Login</a>
                        <a href="{% url 'signup' %}" class="btn btn-default-custom flex-grow-1">Sign Up</a>
                    </div>
                `;
            }
        }

        // --- Event Handlers ---
        function toggleMobileMenu() {
            navState.mobileMenuOpen = !navState.mobileMenuOpen;
            
            if (navState.mobileMenuOpen) {
                mobileMenu.classList.add('open');
                mobileMenuIcon.classList.remove('bi-list');
                mobileMenuIcon.classList.add('bi-x-lg');
            } else {
                mobileMenu.classList.remove('open');
                mobileMenuIcon.classList.remove('bi-x-lg');
                mobileMenuIcon.classList.add('bi-list');
            }
        }

        // Expose logout for inline onClick
        // Expose logout for inline onClick
        window.handleLogout = function() {
            // Submit the hidden form if it exists, or just visit the URL if it was a GET (Django best practice is POST for logout)
            // Since we didn't add the form in desktop view yet, let's just create one dynamically or append it
            let form = document.getElementById('logoutForm');
            if(!form) {
                form = document.createElement('form');
                form.method = 'POST';
                form.action = "{% url 'logout' %}";
                const csrf = document.createElement('input');
                csrf.type = 'hidden';
                csrf.name = 'csrfmiddlewaretoken';
                csrf.value = '{{ csrf_token }}';
                form.appendChild(csrf);
                document.body.appendChild(form);
            }
            form.submit();
        };
        renderNavbar(); // Re-render

        if(mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        }

        // Initial Render
        // Hook into Main State changes if possible, or just render once
        renderNavbar();
    })();
    </script>
</body>
</html>
