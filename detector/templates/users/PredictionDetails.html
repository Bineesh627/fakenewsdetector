<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Detail - TruthGuard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* Custom Styles to match the React/Tailwind aesthetic */
        body {
            background-color: #ffffff;
            color: #0f172a; /* text-foreground */
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Utilities matching Tailwind classes */
        .text-muted-foreground { color: #64748b; }
        .text-sm { font-size: 0.875rem; }
        .font-semibold { font-weight: 600; }
        .tracking-wide { letter-spacing: 0.025em; }

        /* Card Styling */
        .card-custom {
            border: 1px solid #e2e8f0;
            border-radius: 1rem; /* rounded-2xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Custom Badges & Backgrounds */
        .bg-soft-success {
            background-color: rgba(22, 163, 74, 0.1); /* bg-success/10 */
        }
        .bg-soft-danger {
            background-color: rgba(220, 38, 38, 0.1); /* bg-destructive/10 */
        }
        
        .badge-real {
            background-color: #16a34a; /* success */
            color: white;
            font-size: 1.125rem; /* text-lg */
            padding: 0.25rem 1rem;
        }
        
        .badge-fake {
            background-color: #dc2626; /* destructive */
            color: white;
            font-size: 1.125rem;
            padding: 0.25rem 1rem;
        }

        .badge-outline-warning {
            border: 1px solid #eab308;
            color: #eab308; /* warning */
            background: transparent;
        }

        /* Text Block */
        .text-content-box {
            background-color: rgba(241, 245, 249, 0.5); /* secondary/50 */
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
            white-space: pre-wrap;
            line-height: 1.625;
        }

        /* Buttons */
        .btn-vote-up {
            background-color: #f1f5f9;
            color: #16a34a;
            border: 1px solid #e2e8f0;
        }
        .btn-vote-up:hover { background-color: #e2e8f0; color: #15803d; }
        
        .btn-vote-down {
            background-color: #f1f5f9;
            color: #dc2626;
            border: 1px solid #e2e8f0;
        }
        .btn-vote-down:hover { background-color: #e2e8f0; color: #b91c1c; }

        .btn-outline-custom {
            border: 1px solid #e2e8f0;
            background: white;
            color: #0f172a;
        }
        .btn-outline-custom:hover { background-color: #f1f5f9; }

        .back-link {
            text-decoration: none;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #0f172a; }

        /* Action Buttons at bottom */
        .action-btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        @media (max-width: 576px) {
            .action-btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Navbar Component -->
    <!-- Navbar Component -->
    {% include 'users/UserNavbar.html' %}

    <div class="container py-5">
        <div id="content-root" class="mx-auto" style="max-width: 768px;">
            <!-- Content will be injected here by JavaScript -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Mock Data (from mockData.ts) ---
        // --- Real Data from Backend ---
        const rawPredictions = JSON.parse("{{ predictions_json|escapejs }}");
        
        // Convert ISO date strings to Date objects
        const mockPredictions = rawPredictions.map(p => ({
            ...p,
            createdAt: new Date(p.createdAt)
        }));

        // --- Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const contentRoot = document.getElementById('content-root');

            // 1. Get ID from URL or default to '1' for demo purposes
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || '1';

            // 2. Find prediction
            // 2. Find prediction (Server returns an array with ONLY the requested item)
            // So we can just take the first one, or find by ID if we returned multiple.
            const prediction = mockPredictions.find(p => p.id === id) || mockPredictions[0];

            // 3. Render
            if (!prediction) {
                renderNotFound(contentRoot);
            } else {
                renderPrediction(contentRoot, prediction);
            }
        });

        function renderNotFound(container) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <h1 class="h3 fw-bold mb-3">Prediction Not Found</h1>
                    <a href="{% url 'predictions_list' %}" class="btn btn-outline-custom">
                        <i class="bi bi-arrow-left me-2"></i> Back to Predictions
                    </a>
                </div>
            `;
        }

        function renderPrediction(container, prediction) {
            // Helpers
            const confidencePercent = Math.round(prediction.confidence * 100);
            const isReal = prediction.prediction === 'Real';
            
            // Format Date
            const dateStr = prediction.createdAt.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // Conditional Styles
            const headerBgClass = isReal ? 'bg-soft-success' : 'bg-soft-danger';
            const badgeClass = isReal ? 'badge-real' : 'badge-fake';
            const badgeText = prediction.prediction;

            // Optional Elements
            const correctionBadge = prediction.isCorrection 
                ? `<span class="badge rounded-pill badge-outline-warning ms-2 d-inline-flex align-items-center">
                     <i class="bi bi-exclamation-triangle me-1"></i> Flagged for Review
                   </span>` 
                : '';

            const linkElement = prediction.linkUrl 
                ? `<a href="${prediction.linkUrl}" target="_blank" class="text-decoration-none d-inline-flex align-items-center ms-3">
                     <i class="bi bi-box-arrow-up-right me-1"></i> Source Link
                   </a>` 
                : '';

            // HTML Template
            container.innerHTML = `
                <!-- Back Link -->
                <a href="{% url 'predictions_list' %}" class="back-link">
                    <i class="bi bi-arrow-left me-2"></i> Back to all predictions
                </a>

                <!-- Main Card -->
                <div class="card-custom bg-white">
                    
                    <!-- Header -->
                    <div class="px-4 py-3 ${headerBgClass} d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge rounded-pill ${badgeClass}">${badgeText}</span>
                            <span class="fw-medium text-sm">${confidencePercent}% confidence</span>
                        </div>
                        ${correctionBadge}
                    </div>

                    <!-- Content -->
                    <div class="p-4">
                        <!-- Meta Info -->
                        <div class="d-flex align-items-center text-muted-foreground text-sm mb-4">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-clock me-1"></i> ${dateStr}
                            </div>
                            ${linkElement}
                        </div>

                        <!-- Full Text -->
                        <div class="mb-4">
                            <h2 class="text-uppercase text-muted-foreground text-sm fw-bold mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">Full Text</h2>
                            <div class="text-content-box">
                                ${prediction.text}
                            </div>
                        </div>

                        <!-- Voting Section -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <div class="d-flex gap-3">
                                <button class="btn btn-sm btn-vote-up d-flex align-items-center gap-2 px-3 py-2" onclick="handleVote('up', '${prediction.id}')">
                                    <i class="bi bi-hand-thumbs-up-fill"></i>
                                    <span class="fw-bold" id="vote-up-count">${prediction.votesUp}</span>
                                </button>
                                <button class="btn btn-sm btn-vote-down d-flex align-items-center gap-2 px-3 py-2" onclick="handleVote('down', '${prediction.id}')">
                                    <i class="bi bi-hand-thumbs-down-fill"></i>
                                    <span class="fw-bold" id="vote-down-count">${prediction.votesDown}</span>
                                </button>
                            </div>
                            <button class="btn btn-sm btn-outline-custom d-flex align-items-center">
                                <i class="bi bi-share me-2"></i> Share
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="action-btn-group">
                    <a href="/feedback/${prediction.id}" class="btn btn-outline-custom flex-grow-1 py-2">
                        <i class="bi bi-exclamation-triangle me-2"></i> Report Incorrect
                    </a>
                    <a href="/" class="btn btn-dark flex-grow-1 py-2">
                        Check Another Article
                    </a>
                </div>
            `;
        }

        // Real Vote Handler - redirects to backend view
        window.handleVote = function(type, id) {
             // Construct the URL: /vote/<id>/<type>/
             // This hits the Django view. 
             // If not logged in -> @login_required redirects to login -> then back here (or to vote url).
             window.location.href = `/vote/${id}/${type.toUpperCase()}/`;
        };

    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Navbar Logic -->
</body>
</html>
