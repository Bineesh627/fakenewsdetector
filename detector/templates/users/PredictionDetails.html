<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Detail - TruthGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    <style>
        body { padding-top: 4rem; background-color: #0f172a; font-family: 'Inter', system-ui, sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .text-content-scroll { max-height: 50vh; overflow-y: auto; }
        
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.8); }
    </style>
</head>
<body class="text-slate-200 bg-transparent relative min-h-screen flex flex-col">
    <!-- Futuristic Animated Background (Vanta.js Net) -->
    <div id="vanta-bg" class="fixed inset-0 -z-20"></div>
    <div class="fixed inset-0 bg-slate-900/60 -z-10 pointer-events-none"></div>

    {% include 'users/UserNavbar.html' %}

    <main class="flex-grow container mx-auto px-4 py-8 max-w-3xl z-10">
        <div id="content-root">
            <div class="flex items-center justify-center p-20">
                <i data-lucide="loader-2" class="w-8 h-8 text-indigo-500 animate-spin"></i>
            </div>
        </div>
    </main>

    <script>
        const rawPredictions = JSON.parse("{{ predictions_json|escapejs }}");
        const mockPredictions = rawPredictions.map(p => ({
            ...p,
            createdAt: new Date(p.createdAt)
        }));

        document.addEventListener('DOMContentLoaded', () => {
            const contentRoot = document.getElementById('content-root');
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || '1';
            const prediction = mockPredictions.find(p => p.id === id) || mockPredictions[0];

            if (!prediction) {
                renderNotFound(contentRoot);
            } else {
                renderPrediction(contentRoot, prediction);
                lucide.createIcons();
            }
        });

        function renderNotFound(container) {
            container.innerHTML = `
                <div class="glass-panel p-12 rounded-3xl text-center border-slate-700">
                    <div class="inline-flex p-4 rounded-full bg-slate-800 mb-4 border border-slate-600">
                        <i data-lucide="server-off" class="w-8 h-8 text-blue-400"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-white mb-2">Data Node Not Found</h1>
                    <p class="text-slate-400 mb-6">The neural node you're looking for doesn't exist or has been corrupted.</p>
                    <a href="{% url 'predictions_list' %}" class="inline-flex items-center gap-2 px-6 py-2.5 bg-blue-600 border border-blue-500 text-white font-mono text-sm uppercase tracking-wider rounded-xl hover:bg-blue-700 transition-colors text-decoration-none shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Global Ledger
                    </a>
                </div>
            `;
            lucide.createIcons();
        }

        function renderPrediction(container, prediction) {
            const conf = Math.round(prediction.confidence * 100);
            const isReal = prediction.prediction === 'Real';
            const dateStr = prediction.createdAt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            
            // Adjust to extreme dark-glowing themes
            const headerBgClass = isReal ? 'bg-gradient-to-r from-green-900/80 to-emerald-800/80 border-b border-green-500/50 shadow-[0_4px_20px_rgba(34,197,94,0.3)]' : 'bg-gradient-to-r from-red-900/80 to-rose-800/80 border-b border-red-500/50 shadow-[0_4px_20px_rgba(239,68,68,0.3)]';

            const flagBadge = prediction.isCorrection 
                ? `<div class="bg-amber-900/50 backdrop-blur-md border border-amber-500/50 text-amber-400 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full flex items-center gap-1.5 shadow-[0_0_10px_rgba(245,158,11,0.3)]"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Node Flagged</div>` 
                : '';

            container.innerHTML = `
                <a href="{% url 'predictions_list' %}" class="inline-flex items-center gap-2 text-slate-400 hover:text-blue-400 font-mono text-sm uppercase tracking-wider mb-6 transition-colors text-decoration-none focus:outline-none">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Return to Ledger
                </a>

                <div class="glass-panel overflow-hidden">
                    
                    <!-- Header -->
                    <div class="${headerBgClass} p-6 sm:p-8 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <h2 class="text-3xl font-extrabold tracking-widest font-mono uppercase">[ ${prediction.prediction} ]</h2>
                            <div class="h-8 w-px bg-white/20"></div>
                            <span class="text-lg font-mono font-bold text-white/90 bg-white/10 border border-white/20 px-3 py-1 rounded-lg backdrop-blur-sm shadow-inner">${conf}% CERTITUDE</span>
                        </div>
                        ${flagBadge}
                    </div>

                    <!-- Content -->
                    <div class="p-6 sm:p-8">
                        <div class="flex items-center text-blue-400 text-xs font-mono font-medium mb-6 bg-blue-900/20 inline-flex px-3 py-1.5 rounded-lg border border-blue-500/30 uppercase tracking-wider opacity-80">
                            <i data-lucide="terminal" class="w-4 h-4 mr-2"></i> LOG DATE: ${dateStr}
                        </div>

                        <!-- Full Text -->
                        <div class="mb-8 relative">
                            <div class="absolute -left-3 top-0 bottom-0 w-1 bg-gradient-to-b from-blue-500 to-transparent opacity-50"></div>
                            <h3 class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-3 flex items-center gap-2 font-mono">
                                <i data-lucide="cpu" class="w-4 h-4"></i> Raw Neural Data
                            </h3>
                            <div class="text-content-scroll bg-slate-900/60 border border-slate-700 p-5 rounded-2xl text-slate-300 leading-relaxed font-mono text-sm shadow-inner">
                                ${prediction.text.replace(/\n/g, '<br>')}
                            </div>
                        </div>

                        <!-- Voting Section -->
                        <div class="flex flex-col sm:flex-row items-center justify-between pt-6 border-t border-slate-700/50 gap-4">
                            <div class="flex items-center gap-3 w-full sm:w-auto">
                                <button onclick="handleVote('up', '${prediction.id}')" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800/80 border border-slate-600 hover:border-green-500/50 hover:bg-green-900/30 text-slate-300 hover:text-green-400 font-mono font-bold transition-all shadow-sm outline-none">
                                    <i data-lucide="chevron-up" class="w-5 h-5"></i>
                                    <span>${prediction.votesUp}</span>
                                </button>
                                <button onclick="handleVote('down', '${prediction.id}')" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800/80 border border-slate-600 hover:border-red-500/50 hover:bg-red-900/30 text-slate-300 hover:text-red-400 font-mono font-bold transition-all shadow-sm outline-none">
                                    <i data-lucide="chevron-down" class="w-5 h-5"></i>
                                    <span>${prediction.votesDown}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="flex flex-col sm:flex-row gap-4 mt-6">
                    <a href="/feedback/${prediction.id}" class="flex-1 flex justify-center items-center gap-2 px-6 py-3.5 bg-slate-800/60 border border-slate-600 hover:border-amber-500/50 hover:bg-amber-900/20 text-slate-300 hover:text-amber-400 font-mono text-sm uppercase font-bold rounded-2xl transition-all text-decoration-none backdrop-blur-lg">
                        <i data-lucide="flag" class="w-4 h-4 text-amber-500"></i> Report Anomaly
                    </a>
                    <a href="{% url 'check_news' %}" class="flex-1 flex justify-center items-center gap-2 px-6 py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-mono text-sm uppercase font-bold rounded-2xl shadow-[0_0_20px_rgba(59,130,246,0.5)] border border-blue-400 transition-all text-decoration-none">
                        <i data-lucide="scan-line" class="w-4 h-4 shadow-sm"></i> Scan New Data
                    </a>
                </div>
            `;
        }

        window.handleVote = function(type, id) {
             window.location.href = `/vote/${id}/${type.toUpperCase()}/`;
        };
    </script>
    
    <!-- Vanta.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x0f172a,
            points: 12.00,
            maxDistance: 22.00,
            spacing: 18.00,
            showDots: true
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
