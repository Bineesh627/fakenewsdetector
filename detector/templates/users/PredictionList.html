<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Predictions - TruthGuard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
     {% load static %}
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* --- Base Styles --- */
        body {
            background-color: #ffffff;
            color: #0f172a; /* foreground */
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* --- Utilities --- */
        .text-muted-foreground { color: #64748b; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .font-bold { font-weight: 700; }
        .font-medium { font-weight: 500; }
        
        /* --- Card Components --- */
        .card-filter {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem; /* rounded-xl */
            padding: 1rem;
        }

        .prediction-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 1.25rem;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        .prediction-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: #cbd5e1;
        }

        /* --- Input & Select Styling --- */
        .form-control, .form-select {
            border-color: #e2e8f0;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0f172a;
            box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.1);
        }

        .input-group-text {
            background: transparent;
            border-right: none;
            border-color: #e2e8f0;
            color: #64748b;
        }
        .search-input {
            border-left: none;
        }

        /* --- Badges --- */
        .badge-custom {
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
        }
        
        .badge-real {
            background-color: rgba(22, 163, 74, 0.1);
            color: #16a34a; /* success */
            border: 1px solid rgba(22, 163, 74, 0.2);
        }
        
        .badge-fake {
            background-color: rgba(220, 38, 38, 0.1);
            color: #dc2626; /* destructive */
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .badge-flagged {
            background: transparent;
            color: #eab308; /* warning */
            border: 1px solid rgba(234, 179, 8, 0.5);
        }

        /* --- Buttons --- */
        .btn-vote {
            background-color: #f1f5f9; /* secondary */
            color: #0f172a;
            border: 1px solid #e2e8f0;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.375rem 0.75rem;
            transition: colors 0.2s;
        }

        .btn-vote-up:hover { color: #16a34a; background-color: #e2e8f0; }
        .btn-vote-down:hover { color: #dc2626; background-color: #e2e8f0; }

        .btn-outline-custom {
            border: 1px solid #e2e8f0;
            color: #0f172a;
            background: transparent;
        }
        .btn-outline-custom:hover { background-color: #f1f5f9; }

        /* --- Typography & Links --- */
        .card-text-link {
            color: #0f172a;
            text-decoration: none;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 1rem;
            line-height: 1.5;
        }
        .card-text-link:hover { color: #2563eb; }

        .source-link {
            color: #2563eb; /* primary */
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .source-link:hover { text-decoration: underline; }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Navbar Component -->
    <nav class="navbar-custom">
        <div class="container navbar-content">
            
            <!-- 1. Logo -->
            <a href="/" class="logo-link">
                <div class="logo-icon-box">
                    <i class="bi bi-shield-check text-dark"></i>
                </div>
                <span class="fw-bold fs-5">TruthGuard</span>
            </a>

            <!-- 2. Desktop Navigation (Hidden on Mobile) -->
            <div class="d-none d-md-flex align-items-center gap-4">
                <a href="/" class="nav-link-custom active">Home</a>
                <a href="{% url 'predictions_list' %}" class="nav-link-custom">All Predictions</a>
            </div>

            <!-- 3. Auth Section (Hidden on Mobile) -->
            <div class="d-none d-md-flex align-items-center gap-3" id="desktopAuthSection">
                <!-- Javascript will populate this based on state -->
            </div>

            <!-- 4. Mobile Menu Button -->
            <button class="btn btn-ghost-custom d-md-none p-2" id="mobileMenuBtn">
                <i class="bi bi-list fs-5" id="mobileMenuIcon"></i>
            </button>
        </div>

        <!-- 5. Mobile Menu Dropdown -->
        <div class="container mobile-menu" id="mobileMenu">
            <div class="d-flex flex-column gap-2">
                <a href="/" class="mobile-nav-link active">Home</a>
                <a href="{% url 'predictions_list' %}" class="mobile-nav-link">All Predictions</a>
                
                <!-- Mobile Auth Section -->
                <div class="border-top pt-3 mt-2" id="mobileAuthSection">
                    <!-- Javascript will populate this -->
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="mx-auto" style="max-width: 900px;">
            
            <!-- Header -->
            <div class="mb-5">
                <h1 class="display-6 font-bold mb-2">All Predictions</h1>
                <p class="text-muted-foreground">Browse and vote on submitted news articles</p>
            </div>

            <!-- Filter Controls -->
            <div class="card-filter mb-5">
                <div class="row g-3">
                    <!-- Search -->
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control search-input" id="searchInput" placeholder="Search predictions...">
                        </div>
                    </div>
                    
                    <!-- Filter Type -->
                    <div class="col-6 col-md-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-funnel"></i></span>
                            <select class="form-select" id="filterType">
                                <option value="all">All</option>
                                <option value="Real">Real Only</option>
                                <option value="Fake">Fake Only</option>
                            </select>
                        </div>
                    </div>

                    <!-- Sort Order -->
                    <div class="col-6 col-md-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-sort-down"></i></span>
                            <select class="form-select" id="sortBy">
                                <option value="newest">Newest</option>
                                <option value="votes">Most Voted</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results Count -->
            <p class="text-sm text-muted-foreground mb-3">
                Showing <span id="resultsCount">0</span> predictions
            </p>

            <!-- Predictions List Container -->
            <div id="predictionsList">
                <!-- Javascript will populate this -->
            </div>

            <!-- No Results State -->
            <div id="noResults" class="text-center py-5 card-filter d-none">
                <p class="text-muted-foreground mb-3">No predictions found matching your criteria.</p>
                <button class="btn btn-outline-custom" id="clearFiltersBtn">
                    Clear Filters
                </button>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Mock Data ---
        // --- Real Data from Backend ---
        const rawPredictions = JSON.parse("{{ predictions_json|escapejs }}");
        
        // Convert ISO date strings to Date objects
        const mockPredictions = rawPredictions.map(p => ({
            ...p,
            createdAt: new Date(p.createdAt)
        }));

        // --- State ---
        const state = {
            searchQuery: '',
            filterType: 'all',
            sortBy: 'newest'
        };

        // --- DOM Elements ---
        const predictionsListEl = document.getElementById('predictionsList');
        const searchInputEl = document.getElementById('searchInput');
        const filterTypeEl = document.getElementById('filterType');
        const sortByEl = document.getElementById('sortBy');
        const resultsCountEl = document.getElementById('resultsCount');
        const noResultsEl = document.getElementById('noResults');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');

        // --- Core Functions ---

        function filterAndSortPredictions() {
            // Filter
            let filtered = mockPredictions.filter(p => {
                const matchesSearch = p.text.toLowerCase().includes(state.searchQuery.toLowerCase());
                const matchesFilter = state.filterType === 'all' || p.prediction === state.filterType;
                return matchesSearch && matchesFilter;
            });

            // Sort
            filtered.sort((a, b) => {
                if (state.sortBy === 'newest') {
                    return b.createdAt.getTime() - a.createdAt.getTime();
                } else {
                    // Sort by net score (votesUp - votesDown)
                    const scoreA = a.votesUp - a.votesDown;
                    const scoreB = b.votesUp - b.votesDown;
                    return scoreB - scoreA;
                }
            });

            return filtered;
        }

        function renderPredictionCard(prediction, index) {
            const confidencePercent = Math.round(prediction.confidence * 100);
            const isReal = prediction.prediction === 'Real';
            const badgeClass = isReal ? 'badge-real' : 'badge-fake';
            const dateStr = prediction.createdAt.toLocaleDateString();
            
            // Animation delay based on index
            const delay = index * 50;

            // Optional Flagged Badge
            const flaggedBadge = prediction.isCorrection 
                ? `<span class="badge-custom badge-flagged ms-2"><i class="bi bi-exclamation-triangle me-1"></i> Flagged</span>` 
                : '';

            // Optional Link
            const linkHtml = prediction.linkUrl 
                ? `<a href="${prediction.linkUrl}" target="_blank" class="source-link mt-2">
                     <i class="bi bi-box-arrow-up-right"></i> Source Link
                   </a>` 
                : '';

            return `
                <article class="prediction-card" style="animation-delay: ${delay}ms">
                    <!-- Header -->
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge-custom ${badgeClass}">${prediction.prediction}</span>
                            <span class="text-xs text-muted-foreground">${confidencePercent}% confidence</span>
                        </div>
                        ${flaggedBadge}
                    </div>

                    <!-- Body -->
                    <div class="mb-3">
                        <a href="/prediction/${prediction.id}" class="card-text-link">
                            ${prediction.text}
                        </a>
                        ${linkHtml}
                    </div>

                    <!-- Footer -->
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <div class="text-xs text-muted-foreground d-flex align-items-center gap-1">
                            <i class="bi bi-clock"></i> ${dateStr}
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-vote btn-vote-up" onclick="handleVote('${prediction.id}', 'up')">
                                <i class="bi bi-hand-thumbs-up"></i>
                                <span>${prediction.votesUp}</span>
                            </button>
                            <button class="btn btn-sm btn-vote btn-vote-down" onclick="handleVote('${prediction.id}', 'down')">
                                <i class="bi bi-hand-thumbs-down"></i>
                                <span>${prediction.votesDown}</span>
                            </button>
                        </div>
                    </div>
                </article>
            `;
        }

        function render() {
            const predictions = filterAndSortPredictions();
            
            // Update Count
            resultsCountEl.textContent = predictions.length;

            if (predictions.length === 0) {
                predictionsListEl.innerHTML = '';
                noResultsEl.classList.remove('d-none');
            } else {
                noResultsEl.classList.add('d-none');
                predictionsListEl.innerHTML = predictions.map((p, index) => renderPredictionCard(p, index)).join('');
            }
        }

        // --- Event Listeners ---

        searchInputEl.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            render();
        });

        filterTypeEl.addEventListener('change', (e) => {
            state.filterType = e.target.value;
            render();
        });

        sortByEl.addEventListener('change', (e) => {
            state.sortBy = e.target.value;
            render();
        });

        clearFiltersBtn.addEventListener('click', () => {
            state.searchQuery = '';
            state.filterType = 'all';
            
            // Reset Inputs
            searchInputEl.value = '';
            filterTypeEl.value = 'all';
            
            render();
        });

        // Mock Vote Handler
        window.handleVote = function(id, type) {
            console.log(`Voted ${type} on ${id}`);
            alert(`Voted ${type} on prediction #${id}`);
            // In a real app, we would update state/API and re-render here
        };

        // --- Initial Render ---
        render();

    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Navbar Logic -->
    <script>
    (function() {
         // --- State Management ---
         const navState = {
            isAuthenticated: "{{ user.is_authenticated|yesno:'true,false' }}" === "true",
            mobileMenuOpen: false,
            user: {
                username: "{{ user.username|escapejs }}",
                isAdmin: "{{ user.is_staff|yesno:'true,false' }}" === "true"
            }
        };

        // --- DOM Elements ---
        const desktopAuthContainer = document.getElementById('desktopAuthSection');
        const mobileAuthContainer = document.getElementById('mobileAuthSection');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenuIcon = document.getElementById('mobileMenuIcon');

        // --- Render Functions ---
        function renderNavbar() {
            // Check if we can sync with main page state if available
            if (typeof state !== 'undefined' && state.isAuthenticated !== undefined) {
                navState.isAuthenticated = state.isAuthenticated;
                if(state.user) navState.user = state.user;
            }

            // Render Desktop Auth
            if (navState.isAuthenticated) {
                // Logged In View
                const adminLink = navState.user.isAdmin 
                    ? `<a href="/admin" class="btn btn-outline-custom btn-sm">Admin Panel</a>` 
                    : '';

                const authHtml = `
                    <div class="d-flex align-items-center gap-2 text-sm text-muted" style="font-size: 0.875rem;">
                        <i class="bi bi-person text-secondary"></i>
                        <span class="fw-medium text-dark">${navState.user.username}</span>
                    </div>
                    ${adminLink}
                    <button class="btn btn-ghost-custom btn-sm" onclick="handleLogout()">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                `;
                desktopAuthContainer.innerHTML = authHtml;
                
                // Mobile Auth View
                mobileAuthContainer.innerHTML = `
                    <div class="d-flex align-items-center gap-2 mb-3 text-sm">
                        <i class="bi bi-person text-secondary"></i>
                        <span class="fw-medium">${navState.user.username}</span>
                    </div>
                    ${navState.user.isAdmin ? `
                        <a href="/admin" class="btn btn-outline-custom w-100 mb-2">Admin Panel</a>
                    ` : ''}
                    <button class="btn btn-ghost-custom w-100 text-start ps-0" onclick="handleLogout()">
                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </button>
                    <!-- Actual Logout Form for Django -->
                    <form id="logoutForm" action="{% url 'logout' %}" method="post" style="display:none">{% csrf_token %}</form>
                `;

            } else {
                // Guest View
                const guestHtml = `
                    <a href="{% url 'login' %}" class="btn btn-ghost-custom btn-sm">Login</a>
                    <a href="{% url 'signup' %}" class="btn btn-default-custom btn-sm">Sign Up</a>
                `;
                desktopAuthContainer.innerHTML = guestHtml;

                // Mobile Guest View
                mobileAuthContainer.innerHTML = `
                    <div class="d-flex gap-2">
                        <a href="{% url 'login' %}" class="btn btn-ghost-custom flex-grow-1">Login</a>
                        <a href="{% url 'signup' %}" class="btn btn-default-custom flex-grow-1">Sign Up</a>
                    </div>
                `;
            }
        }

        // --- Event Handlers ---
        function toggleMobileMenu() {
            navState.mobileMenuOpen = !navState.mobileMenuOpen;
            
            if (navState.mobileMenuOpen) {
                mobileMenu.classList.add('open');
                mobileMenuIcon.classList.remove('bi-list');
                mobileMenuIcon.classList.add('bi-x-lg');
            } else {
                mobileMenu.classList.remove('open');
                mobileMenuIcon.classList.remove('bi-x-lg');
                mobileMenuIcon.classList.add('bi-list');
            }
        }

        // Expose logout for inline onClick
        window.handleLogout = function() {
            // Submit the hidden form if it exists, or just visit the URL if it was a GET (Django best practice is POST for logout)
            // Since we didn't add the form in desktop view yet, let's just create one dynamically or append it
            let form = document.getElementById('logoutForm');
            if(!form) {
                form = document.createElement('form');
                form.method = 'POST';
                form.action = "{% url 'logout' %}";
                const csrf = document.createElement('input');
                csrf.type = 'hidden';
                csrf.name = 'csrfmiddlewaretoken';
                csrf.value = '{{ csrf_token }}';
                form.appendChild(csrf);
                document.body.appendChild(form);
            }
            form.submit();
        };
        renderNavbar(); // Re-render

        if(mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        }

        // Initial Render
        // Hook into Main State changes if possible, or just render once
        renderNavbar();
    })();
    </script>
</body>
</html>
