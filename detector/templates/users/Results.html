<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result - TruthGuard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* --- Base Styles --- */
        body {
            background-color: transparent !important;
            font-family: system-ui, -apple-system, sans-serif;
            color: #e2e8f0;
            min-height: 100vh;
            padding-top: 4rem;
        }

        /* --- Utilities --- */
        .text-muted-foreground { color: #94a3b8; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .tracking-wide { letter-spacing: 0.05em; }
        .rounded-xl { border-radius: 0.75rem; }

        /* --- Animation --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0; /* Start hidden */
        }

        /* --- Result Icon --- */
        .result-icon-wrapper {
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        .result-icon-wrapper i {
            font-size: 3rem;
        }

        /* --- Color Schemes --- */
        /* Real / Success */
        .theme-real .result-icon-wrapper {
            background-color: rgba(22, 163, 74, 0.2);
            border: 1px solid rgba(22, 163, 74, 0.4);
        }
        .theme-real .text-theme { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.3); }
        .theme-real .bg-bar { background-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }

        /* Fake / Destructive */
        .theme-fake .result-icon-wrapper {
            background-color: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
        }
        .theme-fake .text-theme { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.3); }
        .theme-fake .bg-bar { background-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

        /* --- Cards --- */
        .content-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: left;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            color: #e2e8f0;
        }

        /* --- Progress Bar --- */
        .progress-track {
            height: 1rem;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 9999px;
            overflow: hidden;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            width: 0%; /* Start at 0 for animation */
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Buttons --- */
        .btn-lg-custom {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .btn-outline-custom {
            border: 1px solid rgba(59, 130, 246, 0.5);
            background: rgba(30, 41, 59, 0.6);
            color: #e2e8f0 !important;
        }
        .btn-outline-custom:hover { background-color: rgba(59, 130, 246, 0.2); color: white !important;}

        .btn-dark-custom {
            background-color: #2563eb;
            color: white !important;
            border: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .btn-dark-custom:hover { background-color: #1d4ed8; color: white !important; }

    </style>
</head>
<body class="text-slate-200 bg-transparent min-h-screen relative flex flex-col font-sans">
    <!-- Futuristic Animated Background (Vanta.js Net) -->
    <div id="vanta-bg" class="fixed inset-0" style="z-index: -20;"></div>
    <div class="fixed inset-0 bg-slate-900/60 pointer-events-none" style="z-index: -10;"></div>

    <!-- Navbar Component -->
    {% include 'users/UserNavbar.html' %}

    <div class="container py-5">
        <div id="result-root" class="mx-auto text-center" style="max-width: 672px;">
            <!-- Content will be injected here via JavaScript -->
            <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Mock Data ---
        // --- Real Data from Backend ---
        const rawPredictions = JSON.parse("{{ predictions_json|escapejs }}");
        
        // Convert ISO date strings
        const mockPredictions = rawPredictions.map(p => ({
            ...p,
            createdAt: new Date(p.createdAt)
        }));

        document.addEventListener('DOMContentLoaded', () => {
            const root = document.getElementById('result-root');

            // 2. Find Prediction (Use the one and only injected result)
            const prediction = mockPredictions[0];

            // 3. Render
            renderResult(root, prediction);
        });

        function renderResult(container, prediction) {
            const isReal = prediction.prediction === 'Real';
            const themeClass = isReal ? 'theme-real' : 'theme-fake';
            const confidencePercent = Math.round(prediction.confidence * 100);
            
            // Icon Selection
            const iconHtml = isReal 
                ? '<i class="bi bi-check-circle-fill text-theme"></i>' 
                : '<i class="bi bi-x-circle-fill text-theme"></i>';

            container.innerHTML = `
                <div class="${themeClass}">
                    
                    <!-- Icon -->
                    <div class="result-icon-wrapper animate-fade-in" style="animation-delay: 0ms">
                        ${iconHtml}
                    </div>

                    <!-- Heading -->
                    <h1 class="display-4 font-bold mb-3 text-theme animate-fade-in" style="animation-delay: 100ms">
                        ${prediction.prediction}
                    </h1>

                    <p class="fs-5 text-muted-foreground mb-5 animate-fade-in" style="animation-delay: 200ms">
                        Confidence: <span class="fw-semibold text-white">${confidencePercent}%</span>
                    </p>

                    <!-- Analyzed Text Card -->
                    <div class="content-card animate-fade-in" style="animation-delay: 300ms">
                        <h2 class="text-uppercase text-muted-foreground font-semibold mb-3 tracking-wide" style="font-size: 0.875rem;">
                            Analyzed Text
                        </h2>
                        <p class="mb-0" style="line-height: 1.7;">
                            ${prediction.text}
                        </p>
                    </div>

                    <!-- Confidence Bar Card -->
                    <div class="content-card animate-fade-in" style="animation-delay: 400ms">
                        <h2 class="text-uppercase text-muted-foreground font-semibold mb-3 tracking-wide" style="font-size: 0.875rem;">
                            Confidence Level
                        </h2>
                        
                        <div class="progress-track mb-2">
                            <div id="progressBar" class="progress-fill bg-bar"></div>
                        </div>
                        
                        <div class="d-flex justify-content-between text-muted-foreground" style="font-size: 0.75rem;">
                            <span>0%</span>
                            <span>50%</span>
                            <span>100%</span>
                        </div>
                    </div>

                    <!-- Voting Section -->
                    <div class="content-card animate-fade-in" style="animation-delay: 450ms">
                         <h2 class="text-uppercase text-muted-foreground font-semibold mb-3 tracking-wide" style="font-size: 0.875rem;">
                            Do you agree?
                        </h2>
                        <div class="d-flex justify-content-center gap-3">
                             <button class="btn d-flex align-items-center gap-2 px-4 py-2" style="border: 1px solid rgba(74, 222, 128, 0.5); color: #4ade80; background: rgba(22, 163, 74, 0.1);" onmouseover="this.style.background='rgba(22, 163, 74, 0.3)'" onmouseout="this.style.background='rgba(22, 163, 74, 0.1)'" onclick="handleVote('up', '${prediction.id}')">
                                <i class="bi bi-hand-thumbs-up-fill"></i>
                                <span class="fw-bold">${prediction.votesUp}</span>
                            </button>
                            <button class="btn d-flex align-items-center gap-2 px-4 py-2" style="border: 1px solid rgba(248, 113, 113, 0.5); color: #f87171; background: rgba(220, 38, 38, 0.1);" onmouseover="this.style.background='rgba(220, 38, 38, 0.3)'" onmouseout="this.style.background='rgba(220, 38, 38, 0.1)'" onclick="handleVote('down', '${prediction.id}')">
                                <i class="bi bi-hand-thumbs-down-fill"></i>
                                <span class="fw-bold">${prediction.votesDown}</span>
                            </button>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 animate-fade-in" style="animation-delay: 500ms">
                        <a href="/feedback/${prediction.id}" class="btn btn-outline-custom btn-lg-custom">
                            <i class="bi bi-exclamation-triangle"></i> Mark as Incorrect
                        </a>
                        <a href="/" class="btn btn-dark-custom btn-lg-custom">
                            <i class="bi bi-house"></i> Back to Home
                        </a>
                    </div>

                    <!-- Link -->
                    <div class="mt-4 animate-fade-in" style="animation-delay: 600ms">
                        <a href="/prediction/${prediction.id}" class="text-blue-400 hover:text-blue-300 text-decoration-none d-inline-flex align-items-center gap-1" style="font-size: 0.875rem;">
                            View full details <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>

                </div>
            `;

            // Trigger Progress Bar Animation after render
            setTimeout(() => {
                const bar = document.getElementById('progressBar');
                if(bar) bar.style.width = `${confidencePercent}%`;
            }, 100);
        }

        // Real Vote Handler - redirects to backend view
        window.handleVote = function(type, id) {
             // Construct the URL: /vote/<id>/<type>/
             // This hits the Django view. 
             // If not logged in -> @login_required redirects to login -> then back here.
             window.location.href = `/vote/${id}/${type.toUpperCase()}/`;
        };
    </script>

    </script>

    <!-- Vanta.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x0f172a,
            points: 12.00,
            maxDistance: 22.00,
            spacing: 18.00,
            showDots: true
        });
        // Initialize Icons
        if(typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Navbar Logic -->
</body>
</html>
