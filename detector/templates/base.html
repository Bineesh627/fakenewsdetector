<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake News Detector</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }
      nav {
        margin-bottom: 20px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 10px;
      }
      nav a {
        margin-right: 15px;
        text-decoration: none;
        color: #333;
      }
      nav a:hover {
        text-decoration: underline;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
      button {
        padding: 8px 15px;
        cursor: pointer;
      }
      input,
      textarea,
      select {
        padding: 8px;
        margin: 5px 0;
        width: 100%;
        box-sizing: border-box;
      }
      .prediction-real {
        color: green;
        font-weight: bold;
      }
      .prediction-fake {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'list' %}">All Predictions</a>
      {% if user.is_authenticated %}
      <span>Hello, {{ user.username }}</span>
      <form action="{% url 'logout' %}" method="post" style="display: inline">
        {% csrf_token %}<button
          type="submit"
          style="
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
            text-decoration: underline;
          "
        >
          Logout
        </button>
      </form>
      {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'signup' %}">Signup</a>
      {% endif %}
    </nav>
    <main>{% block content %} {% endblock %}</main>
  </body>
</html>
