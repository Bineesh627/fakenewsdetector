<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TruthGuard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* --- Custom Styling to match React/Tailwind design --- */
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 1rem; /* rounded-2xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            width: 100%;
            max-width: 450px; /* max-w-md */
        }

        /* Icon Container (Shield) */
        .icon-circle {
            background-color: rgba(13, 110, 253, 0.1); /* bg-primary/10 */
            border-radius: 0.75rem;
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .icon-circle i {
            color: #0d6efd; /* text-primary */
            font-size: 2rem;
        }

        /* Form Labels */
        .form-label {
            font-size: 0.875rem; /* text-sm */
            font-weight: 500; /* font-medium */
            margin-bottom: 0.5rem;
            color: #212529;
        }

        /* Custom Input Groups (Mimicking React "relative" wrapper) */
        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d; /* text-muted-foreground */
            z-index: 5;
            pointer-events: none;
            font-size: 1rem;
        }

        .custom-input {
            height: 3rem; /* h-12 */
            padding-left: 2.5rem; /* pl-10 (Space for icon) */
            border-radius: 0.375rem;
            border: 1px solid #e2e8f0;
            font-size: 0.875rem;
        }
        
        .custom-input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.2); /* ring style */
        }

        /* Helper Text */
        .helper-text {
            font-size: 0.75rem; /* text-xs */
            color: #6c757d; /* text-muted-foreground */
            margin-top: 0.5rem;
        }

        /* Submit Button */
        .btn-custom {
            height: 3rem; /* h-12 */
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* Error Message Box */
        .error-box {
            background-color: rgba(220, 53, 69, 0.1); /* bg-destructive/10 */
            color: #dc3545; /* text-destructive */
            font-size: 0.875rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.25rem;
            display: none; /* Hidden by default */
        }

        /* Links */
        .link-primary {
            text-decoration: none;
            font-weight: 500;
        }
        .link-primary:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Navbar Component -->
    <!-- Navbar Component -->
    {% include 'users/UserNavbar.html' %}

    <div class="container px-4 py-5">
        <div class="d-flex justify-content-center">
            <div class="signup-card">
                
                <!-- Header Section -->
                <div class="text-center mb-4">
                    <div class="icon-circle">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-2">Create Account</h1>
                    <p class="text-muted small">Join TruthGuard and fight misinformation</p>
                </div>

                <!-- Form Section -->
                <!-- Form Section -->
                <form id="signupForm" method="POST" action="">
                    {% csrf_token %}
                    <!-- Error Alert -->
                    {% if error %}
                    <div class="error-box" style="display: block;">
                        {{ error }}
                    </div>
                    {% endif %}
                    
                    <div id="clientError" class="error-box"></div>

                    <!-- Username Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person input-icon"></i>
                            <input type="text" class="form-control custom-input" id="username" name="username"
                                   placeholder="johndoe" required>
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" class="form-control custom-input" id="email" name="email"
                                   placeholder="you@example.com" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" class="form-control custom-input" id="password" name="password"
                                   placeholder="••••••••" required minlength="8">
                        </div>
                        <p class="helper-text">Minimum 8 characters</p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-custom" id="submitBtn">
                        <span id="btnText">Create Account</span>
                        <div id="btnLoader" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </form>

                <!-- Footer/Login Link -->
                <p class="text-center text-muted small mt-4">
                    Already have an account? 
                    <a href="{% url 'login' %}" class="link-primary">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signupForm = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const clientError = document.getElementById('clientError');

            signupForm.addEventListener('submit', function(e) {
                // We let the form submit naturally, but we show loading state
                // e.preventDefault(); // removed to allow submission

                // Basic client-side validation could go here
                
                // Show loading state
                submitBtn.disabled = true;
                btnText.textContent = 'Creating account...';
                btnLoader.classList.remove('d-none');
            });
        });
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Navbar Logic -->
</body>
</html>
