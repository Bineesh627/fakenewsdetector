<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TruthGuard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* --- Custom Styling to match Futuristic AI Design --- */
        body {
            background-color: transparent;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .signup-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            width: 100%;
            max-width: 450px;
        }

        /* Icon Container (Shield) */
        .icon-circle {
            background-color: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border-radius: 0.75rem;
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .icon-circle i {
            color: #60a5fa;
            font-size: 2rem;
        }

        /* Form Labels */
        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #93c5fd;
            text-transform: uppercase;
            font-family: monospace;
            letter-spacing: 0.05em;
        }

        /* Custom Input Groups */
        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            z-index: 5;
            pointer-events: none;
            font-size: 1rem;
        }

        .custom-input {
            height: 3rem;
            padding-left: 2.5rem;
            border-radius: 0.375rem;
            background-color: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(71, 85, 105, 0.8) !important;
            color: white !important;
            font-family: monospace;
            font-size: 0.875rem;
        }
        
        .custom-input::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }
        
        .custom-input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2) !important;
        }

        /* Helper Text */
        .helper-text {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.5rem;
            font-family: monospace;
        }

        /* Submit Button */
        .btn-custom {
            height: 3rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: #2563eb !important;
            border-color: #3b82f6 !important;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        
        .btn-custom:hover {
            background-color: #3b82f6 !important;
        }

        /* Error Message Box */
        .error-box {
            background-color: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fca5a5;
            font-size: 0.875rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        /* Links */
        .link-primary {
            text-decoration: none;
            color: #60a5fa !important;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .link-primary:hover {
            text-decoration: none;
            color: #93c5fd !important;
        }
    </style>
</head>
<body class="text-slate-200">
    <!-- Futuristic Animated Background (Vanta.js Net) -->
    <div id="vanta-bg" class="fixed inset-0" style="z-index: -20;"></div>
    <div class="fixed inset-0 bg-slate-900/60 pointer-events-none" style="z-index: -10;"></div>

    <!-- Navbar Component -->
    <!-- Navbar Component -->
    {% include 'users/UserNavbar.html' %}

    <div class="container px-4 py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="d-flex justify-content-center w-100">
            <div class="signup-card">
                
                <!-- Header Section -->
                <div class="text-center mb-4">
                    <div class="icon-circle">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-2 text-white font-monospace text-uppercase" style="text-shadow: 0 0 15px rgba(59,130,246,0.3);">Initialize Neural Link</h1>
                    <p class="text-blue-200 opacity-75 font-monospace small">Join TruthGuard architecture</p>
                </div>

                <!-- Form Section -->
                <!-- Form Section -->
                <form id="signupForm" method="POST" action="">
                    {% csrf_token %}
                    <!-- Error Alert -->
                    {% if error %}
                    <div class="error-box" style="display: block;">
                        {{ error }}
                    </div>
                    {% endif %}
                    
                    <div id="clientError" class="error-box"></div>

                    <!-- Username Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person input-icon"></i>
                            <input type="text" class="form-control custom-input" id="username" name="username"
                                   placeholder="johndoe" required>
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" class="form-control custom-input" id="email" name="email"
                                   placeholder="you@example.com" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" class="form-control custom-input" id="password" name="password"
                                   placeholder="••••••••" required minlength="8">
                        </div>
                        <p class="helper-text">Minimum 8 characters</p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-custom" id="submitBtn">
                        <span id="btnText">Create Account</span>
                        <div id="btnLoader" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </form>

                <!-- Footer/Login Link -->
                <p class="text-center text-slate-400 font-monospace small mt-4">
                    Already operational? 
                    <a href="{% url 'login' %}" class="link-primary">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signupForm = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const clientError = document.getElementById('clientError');

            signupForm.addEventListener('submit', function(e) {
                // We let the form submit naturally, but we show loading state
                // e.preventDefault(); // removed to allow submission

                // Basic client-side validation could go here
                
                // Show loading state
                submitBtn.disabled = true;
                btnText.textContent = 'Creating account...';
                btnLoader.classList.remove('d-none');
            });
        });
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Vanta.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x0f172a,
            points: 12.00,
            maxDistance: 22.00,
            spacing: 18.00,
            showDots: true
        });
    </script>
</body>
</html>
