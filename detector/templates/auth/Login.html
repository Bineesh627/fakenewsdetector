<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TruthGuard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- User Navbar CSS -->
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/UserNavbar.css' %}">
    
    <style>
        /* Custom Styling to match the Futuristic AI design */
        body {
            background-color: transparent;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            width: 100%;
            max-width: 450px;
        }

        /* Icon Container (Shield) */
        .icon-circle {
            background-color: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border-radius: 0.75rem;
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .icon-circle i {
            color: #60a5fa;
            font-size: 2rem;
        }

        /* Custom Input Groups */
        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            z-index: 5;
            pointer-events: none;
        }

        .custom-input {
            height: 3rem;
            padding-left: 2.5rem;
            border-radius: 0.375rem;
            background-color: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(71, 85, 105, 0.8) !important;
            color: white !important;
            font-family: monospace;
        }

        .custom-input::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }

        .custom-input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2) !important;
        }

        /* Button Styling */
        .btn-custom {
            height: 3rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2563eb !important;
            border-color: #3b82f6 !important;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .btn-custom:hover {
            background-color: #3b82f6 !important;
        }

        /* Error Message */
        .error-box {
            background-color: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fca5a5;
            font-size: 0.875rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.25rem;
            display: none;
        }
    </style>
</head>
<body class="text-slate-200">
    <!-- Futuristic Animated Background (Vanta.js Net) -->
    <div id="vanta-bg" class="fixed inset-0" style="z-index: -20;"></div>
    <div class="fixed inset-0 bg-slate-900/60 pointer-events-none" style="z-index: -10;"></div>

    <!-- Navbar Component -->
    <!-- Navbar Component -->
    {% include 'users/UserNavbar.html' %}

    <div class="container px-4">
        <div class="flex-grow flex items-center justify-center p-4">
            <div class="login-card">
                
                <!-- Header Section -->
                <div class="text-center mb-4">
                    <div class="icon-circle">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h1 class="h3 fw-bold mb-2 text-white font-monospace text-uppercase" style="text-shadow: 0 0 15px rgba(59,130,246,0.3);">Authenticate Agent</h1>
                    <p class="text-blue-200 opacity-75 font-monospace small">Initialize secure neural handshake</p>
                </div>

                <!-- Form Section -->
                <!-- Form Section -->
                <form id="loginForm" method="POST" action="">
                    {% csrf_token %}
                    <!-- Error Alert -->
                    {% if error %}
                    <div class="error-box" style="display: block;">
                        {{ error }}
                    </div>
                    {% endif %}
                    
                    <div id="clientError" class="error-box"></div>

                    <!-- Email Input -->
                    <div class="mb-4">
                        <label for="email" class="form-label text-blue-300 font-monospace small text-uppercase">Email</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" class="form-control custom-input" id="email" name="email"
                                   placeholder="agent@network" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-5">
                        <label for="password" class="form-label text-blue-300 font-monospace small text-uppercase">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" class="form-control custom-input" id="password" name="password"
                                   placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 btn-custom" id="submitBtn">
                        <span id="btnText">Sign In</span>
                        <div id="btnLoader" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </form>

                <!-- Footer/Links -->
                <p class="text-center text-slate-400 font-monospace small mt-4">
                    Connection not found? 
                    <a href="{% url 'signup' %}" class="text-blue-400 hover:text-blue-300 text-decoration-none transition-colors">Establish Neural Link</a>
                </p>

                <div class="mt-4 pt-4 border-top border-slate-700">
                    <p class="text-center text-slate-500 font-monospace" style="font-size: 0.70rem;">
                        <strong class="text-blue-400">DEMO OVERRIDE:</strong> Initialize "admin@example.com" for root access
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const clientError = document.getElementById('clientError');

            // Handle Submit
            loginForm.addEventListener('submit', function(e) {
                // Allow natural submission
                // e.preventDefault();

                // Reset State
                if(clientError) clientError.style.display = 'none';
                submitBtn.disabled = true;
                btnText.textContent = 'Signing in...';
                btnLoader.classList.remove('d-none');
            });
        });
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Vanta.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x0f172a,
            points: 12.00,
            maxDistance: 22.00,
            spacing: 18.00,
            showDots: true
        });
    </script>
</body>
</html>
