<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthGuard Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --success: 34, 197, 94;
            --destructive: 239, 68, 68;
            /* Sidebar Variables */

        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            margin: 0; /* Reset margin */
        }

        .text-success { color: rgb(var(--success)); }
        .bg-success { background-color: rgb(var(--success)); }
        .bg-success-soft { background-color: rgba(var(--success), 0.1); }
        
        .text-destructive { color: rgb(var(--destructive)); }
        .bg-destructive { background-color: rgb(var(--destructive)); }
        .bg-destructive-soft { background-color: rgba(var(--destructive), 0.1); }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            line-clamp: 1;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }


    </style>
    <!-- Sidebar CSS -->
     {% load static %}
    <link rel="stylesheet" href="{% static 'css/Sidebar.css' %}">
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Sidebar -->
    <!-- Sidebar -->
    {% include 'admin/Sidebar.html' %}

    <main id="mainContent" class="main-content">
    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- Header -->
        <header>
            <h1 class="text-3xl font-bold text-gray-900">Dashboard</h1>
            <p class="text-gray-500 mt-1">Welcome back! Here's what's happening with TruthGuard.</p>
        </header>

        <!-- Stats Grid -->
        <div id="stats-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Cards injected by JS -->
        </div>

        <!-- Charts and Activity -->
        <div class="grid lg:grid-cols-2 gap-6">
            <!-- Prediction Distribution -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                <h2 class="text-lg font-semibold text-gray-900 mb-6">Prediction Distribution</h2>
                <div id="distribution-container" class="space-y-6">
                    <!-- Progress bars injected by JS -->
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-900">Recent Activity</h2>
                    <button class="text-sm font-medium text-gray-500 hover:text-gray-700 px-3 py-1 rounded-md hover:bg-gray-100 transition-colors">View All</button>
                </div>
                <div id="activity-logs" class="space-y-1">
                    <!-- Logs injected by JS -->
                </div>
            </div>
        </div>

        <!-- Recent Predictions Table -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-900">Recent Predictions</h2>
                <button class="px-4 py-2 text-sm font-medium border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    View All
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Text</th>
                            <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Result</th>
                            <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Confidence</th>
                            <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Votes</th>
                            <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Date</th>
                        </tr>
                    </thead>
                    <tbody id="predictions-body" class="divide-y divide-gray-200">
                        <!-- Table rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Data from Backend
        const predictionsData = JSON.parse('{{ predictions_json|escapejs }}');
        const activityData = JSON.parse('{{ activity_json|escapejs }}');
        const statsInfo = JSON.parse('{{ stats_json|escapejs }}');
        const realCount = Number("{{ real_count|default:0 }}");
        const fakeCount = Number("{{ fake_count|default:0 }}");

        // Initialization
        window.onload = () => {
            renderStats();
            renderDistribution();
            renderActivity();
            renderPredictions();
            lucide.createIcons();
        };

        function renderStats() {
            const container = document.getElementById('stats-grid');
            const stats = [
                { title: 'Total Predictions', value: statsInfo.total_predictions, icon: 'file-text' },
                { title: 'Active Users', value: statsInfo.active_users, icon: 'users' },
                { title: 'Pending Feedback', value: statsInfo.pending_feedback, icon: 'message-square' },
                { title: 'Accuracy Rate', value: statsInfo.accuracy_rate + '%', icon: 'trending-up' }
            ];

            container.innerHTML = stats.map(stat => `
                <div class="bg-white rounded-xl border border-gray-200 p-6 hover:shadow-md transition-all duration-200">
                    <div class="flex items-start justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">${stat.title}</p>
                            <p class="text-3xl font-bold text-gray-900 mt-1">${stat.value}</p>
                        </div>
                        <div class="p-3 rounded-lg bg-blue-50">
                            <i data-lucide="${stat.icon}" class="h-6 w-6 text-blue-600"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderDistribution() {
            const total = realCount + fakeCount;
            const container = document.getElementById('distribution-container');
            
            // Handle zero data case
            if (total === 0) {
                 container.innerHTML = '<p class="text-gray-500 text-sm">No predictions yet.</p>';
                 return;
            }

            const items = [
                { label: 'Real', count: realCount, color: 'success', icon: 'check-circle' },
                { label: 'Fake', count: fakeCount, color: 'destructive', icon: 'x-circle' }
            ];

            container.innerHTML = items.map(item => {
                const percent = Math.round((item.count / total) * 100);
                return `
                <div>
                    <div class="flex justify-between text-sm mb-2">
                        <span class="flex items-center gap-2 font-medium text-gray-700">
                            <i data-lucide="${item.icon}" class="h-4 w-4 text-${item.color}"></i>
                            ${item.label}
                        </span>
                        <span class="font-bold text-gray-900">${item.count} (${percent}%)</span>
                    </div>
                    <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-${item.color} rounded-full" style="width: ${percent}%"></div>
                    </div>
                </div>
            `}).join('');
        }

        function renderActivity() {
            const container = document.getElementById('activity-logs');
            container.innerHTML = activityData.map(log => `
                <div class="flex items-start gap-4 py-3 border-b border-gray-100 last:border-0 hover:bg-gray-50 px-2 rounded-lg transition-colors">
                    <div class="p-2 rounded-md bg-blue-50">
                        <i data-lucide="clock" class="h-4 w-4 text-blue-600"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm text-gray-800 truncate font-medium">${log.details}</p>
                        <p class="text-xs text-gray-400 mt-0.5">${new Date(log.createdAt).toLocaleString()}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderPredictions() {
            const body = document.getElementById('predictions-body');
            body.innerHTML = predictionsData.map(pred => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4">
                        <p class="text-sm text-gray-900 line-clamp-1 max-w-xs">${pred.text}</p>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${
                            pred.prediction === 'Real' 
                            ? 'bg-green-50 text-green-700 border-green-100' 
                            : 'bg-red-50 text-red-700 border-red-100'
                        }">
                            ${pred.prediction}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500 font-medium">
                        ${Math.round(pred.confidence * 100)}%
                    </td>
                    <td class="px-6 py-4 text-sm">
                        <span class="text-success font-semibold">↑${pred.votesUp}</span>
                        <span class="text-gray-300 mx-1">/</span>
                        <span class="text-destructive font-semibold">↓${pred.votesDown}</span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">
                        ${new Date(pred.createdAt).toLocaleDateString()}
                    </td>
                </tr>
            `).join('');
        }
    </script>
    <!-- Sidebar Logic -->
    <!-- Sidebar Logic handled in Sidebar.html -->
    </main>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
