<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthGuard Predictions Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #111827;
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

    </style>
    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="css/Sidebar.css">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <!-- Collapse Button -->
        <button id="sidebarToggle" class="toggle-btn" aria-label="Toggle Sidebar">
            <i class="bi bi-chevron-left" id="toggleIcon"></i>
        </button>

        <!-- Header -->
        <div class="sidebar-header">
            <a href="/admin" class="text-decoration-none d-flex align-items-center gap-3">
                <div class="logo-box">
                    <i class="bi bi-shield-check"></i>
                </div>
                <div class="brand-text">
                    <div class="fw-bold fs-6 text-dark">TruthGuard</div>
                    <div class="text-muted" style="font-size: 0.75rem;">Admin Panel</div>
                </div>
            </a>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
            <a href="/admin" class="nav-link" onclick="setActive(this)">
                <i class="bi bi-speedometer2"></i>
                <span class="link-text">Dashboard</span>
            </a>
            <a href="/admin/users" class="nav-link" onclick="setActive(this)">
                <i class="bi bi-people"></i>
                <span class="link-text">Users</span>
            </a>
            <a href="/admin/predictions" class="nav-link active" onclick="setActive(this)">
                <i class="bi bi-file-text"></i>
                <span class="link-text">Predictions</span>
            </a>
            <a href="/admin/feedback" class="nav-link" onclick="setActive(this)">
                <i class="bi bi-chat-square-text"></i>
                <span class="link-text">Feedback</span>
            </a>
            <a href="/admin/logs" class="nav-link" onclick="setActive(this)">
                <i class="bi bi-activity"></i>
                <span class="link-text">Activity Logs</span>
            </a>
            <a href="/admin/settings" class="nav-link" onclick="setActive(this)">
                <i class="bi bi-gear"></i>
                <span class="link-text">Settings</span>
            </a>
        </nav>

        <!-- User Section -->
        <div class="user-section">
            <div class="user-profile">
                <div class="avatar-circle">
                    <span id="userInitial">A</span>
                </div>
                <div class="user-info d-flex flex-column" style="min-width: 0;">
                    <span class="fw-medium text-dark text-truncate" id="userName" style="font-size: 0.875rem;">Loading...</span>
                    <span class="text-muted text-truncate" id="userEmail" style="font-size: 0.75rem;">Loading...</span>
                </div>
            </div>
            
            <a href="/" class="logout-btn text-decoration-none">
                <i class="bi bi-box-arrow-right" style="width: 1.25rem; text-align: center;"></i>
                <span class="logout-text ms-2" style="font-size: 0.875rem;">Back to Site</span>
            </a>
        </div>
    </aside>

    <main id="mainContent" class="main-content">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900">Predictions</h1>
                <p class="text-gray-500 mt-1">View and manage all model generated predictions</p>
            </div>
            <button class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors shadow-sm">
                <i data-lucide="download" class="h-4 w-4 mr-2"></i>
                Export Data
            </button>
        </div>

        <!-- Toolbar: Search and Filter -->
        <div class="flex flex-col sm:flex-row gap-4">
            <div class="relative flex-1 max-w-md">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400"></i>
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Search predictions..." 
                    class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                >
            </div>
            <div class="relative w-full sm:w-48">
                <select 
                    id="filter-select"
                    class="w-full pl-3 pr-10 py-2 bg-white border border-gray-200 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm"
                >
                    <option value="all">All Predictions</option>
                    <option value="Real">Real Only</option>
                    <option value="Fake">Fake Only</option>
                </select>
                <i data-lucide="filter" class="absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400 pointer-events-none"></i>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Text Content</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Result</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Confidence</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Public Votes</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Created</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="predictions-body" class="divide-y divide-gray-100">
                        <!-- JS Injection -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer Stats -->
        <div id="table-summary" class="text-sm text-gray-500 font-medium">
            <!-- JS Injection -->
        </div>
    </div>

    <!-- Dropdown Template (Simplified for Vanilla JS) -->
    <div id="context-menu" class="hidden absolute bg-white border border-gray-200 rounded-lg shadow-xl py-1 w-40 z-50">
        <button class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">View Details</button>
        <button class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Edit Prediction</button>
        <div class="border-t border-gray-100 my-1"></div>
        <button class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-medium">Delete</button>
    </div>

    <script>
        const mockPredictions = [
            { id: '1', text: 'Scientists discover new species of deep-sea fish with bioluminescent properties in the Mariana Trench...', linkUrl: '#', prediction: 'Real', confidence: 0.94, votesUp: 45, votesDown: 3, isCorrection: false, createdAt: '2024-01-15' },
            { id: '2', text: 'BREAKING: Government secretly installing mind-control chips in all new smartphones...', linkUrl: null, prediction: 'Fake', confidence: 0.98, votesUp: 12, votesDown: 156, isCorrection: false, createdAt: '2024-01-14' },
            { id: '3', text: 'Climate report shows significant reduction in Arctic ice coverage over the past decade...', linkUrl: '#', prediction: 'Real', confidence: 0.89, votesUp: 78, votesDown: 5, isCorrection: false, createdAt: '2024-01-13' },
            { id: '4', text: 'Local bakery wins international award for their innovative sourdough bread recipe...', linkUrl: null, prediction: 'Real', confidence: 0.76, votesUp: 23, votesDown: 8, isCorrection: true, createdAt: '2024-01-12' },
            { id: '5', text: 'Miracle cure found! Drinking lemon water before bed eliminates all diseases within 30 days...', linkUrl: null, prediction: 'Fake', confidence: 0.99, votesUp: 2, votesDown: 234, isCorrection: false, createdAt: '2024-01-11' }
        ];

        let searchQuery = '';
        let filterType = 'all';

        function render() {
            const body = document.getElementById('predictions-body');
            const summary = document.getElementById('table-summary');
            
            const filtered = mockPredictions.filter(p => {
                const matchSearch = p.text.toLowerCase().includes(searchQuery.toLowerCase());
                const matchFilter = filterType === 'all' || p.prediction === filterType;
                return matchSearch && matchFilter;
            });

            summary.textContent = `Showing ${filtered.length} of ${mockPredictions.length} predictions`;

            body.innerHTML = filtered.map(pred => `
                <tr class="hover:bg-gray-50 transition-colors group">
                    <td class="px-6 py-4 text-sm font-mono text-gray-400">#${pred.id}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <p class="text-sm font-medium text-gray-900 line-clamp-1 max-w-[240px]">${pred.text}</p>
                            ${pred.linkUrl ? `
                                <a href="${pred.linkUrl}" class="text-gray-400 hover:text-blue-600 transition-colors">
                                    <i data-lucide="external-link" class="h-3.5 w-3.5"></i>
                                </a>
                            ` : ''}
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ${pred.prediction === 'Real' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${pred.prediction}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-16 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                <div class="h-full rounded-full ${pred.prediction === 'Real' ? 'bg-green-500' : 'bg-red-500'}" style="width: ${pred.confidence * 100}%"></div>
                            </div>
                            <span class="text-xs font-semibold text-gray-500">${Math.round(pred.confidence * 100)}%</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-4 text-xs font-bold">
                            <span class="flex items-center gap-1 text-green-600">
                                <i data-lucide="thumbs-up" class="h-3 w-3"></i> ${pred.votesUp}
                            </span>
                            <span class="flex items-center gap-1 text-red-500">
                                <i data-lucide="thumbs-down" class="h-3 w-3"></i> ${pred.votesDown}
                            </span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        ${pred.isCorrection 
                            ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-amber-50 text-amber-600 border border-amber-200">Flagged</span>`
                            : `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-gray-100 text-gray-500">Active</span>`
                        }
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">
                        ${new Date(pred.createdAt).toLocaleDateString()}
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="toggleMenu(event)" class="p-1.5 hover:bg-gray-100 rounded-md text-gray-400 hover:text-gray-600 transition-all">
                            <i data-lucide="more-vertical" class="h-4 w-4"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            lucide.createIcons();
        }

        // Event Listeners
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        document.getElementById('filter-select').addEventListener('change', (e) => {
            filterType = e.target.value;
            render();
        });

        // Context Menu Logic
        const menu = document.getElementById('context-menu');
        function toggleMenu(e) {
            e.stopPropagation();
            const rect = e.currentTarget.getBoundingClientRect();
            menu.style.top = `${rect.bottom + window.scrollY + 5}px`;
            menu.style.left = `${rect.left + window.scrollX - 120}px`;
            menu.classList.toggle('hidden');
        }

        document.addEventListener('click', () => menu.classList.add('hidden'));

        // Initial Load
        window.onload = render;
    </script>
    <!-- Sidebar Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const toggleBtn = document.getElementById('sidebarToggle');
            const toggleIcon = document.getElementById('toggleIcon');
            
            // --- Mock User Data (from AuthContext) ---
            const user = {
                username: 'admin_user',
                email: 'admin@example.com'
            };

            // 1. Render User Info
            if(document.getElementById('userName')) {
                document.getElementById('userName').textContent = user.username;
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userInitial').textContent = user.username.charAt(0).toUpperCase();
            }

            // 2. Collapse Logic
            let isCollapsed = false;

            toggleBtn.addEventListener('click', () => {
                isCollapsed = !isCollapsed;
                
                if (isCollapsed) {
                    sidebar.classList.add('collapsed');
                    mainContent.classList.add('collapsed');
                    toggleIcon.classList.remove('bi-chevron-left');
                    toggleIcon.classList.add('bi-chevron-right');
                } else {
                    sidebar.classList.remove('collapsed');
                    mainContent.classList.remove('collapsed');
                    toggleIcon.classList.remove('bi-chevron-right');
                    toggleIcon.classList.add('bi-chevron-left');
                }
            });
        });
    </script>
    </main>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
