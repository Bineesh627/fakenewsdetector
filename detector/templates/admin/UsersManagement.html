<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthGuard User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #111827;
        }



        .user-row:hover {
            background-color: #f3f4f6;
        }


    </style>
    <!-- Sidebar CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/Sidebar.css' %}">
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <!-- Sidebar -->
    <!-- Sidebar Component -->
    {% include 'admin/Sidebar.html' %}

    <main id="mainContent" class="main-content">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Users</h1>
                <p class="text-gray-500">Manage user accounts and permissions</p>
            </div>
            <button class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors shadow-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">
                <i data-lucide="user-plus" class="h-4 w-4 mr-2"></i>
                Add Admin
            </button>
        </div>

        <!-- View User Modal -->
        <div class="modal fade" id="viewUserModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">User Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="fw-bold">Username:</label>
                            <span id="viewUsername"></span>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">Email:</label>
                            <span id="viewEmail"></span>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">Role:</label>
                            <span id="viewRole"></span>
                        </div>
                        <div class="mb-3">
                            <label class="fw-bold">Joined:</label>
                            <span id="viewJoined"></span>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit User Modal -->
        <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editUserForm">
                            <input type="hidden" id="editUserId">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" id="editUsername" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="editEmail" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" id="saveEditUserBtn">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Add User Modal -->
        <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add New Admin</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addUserForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" id="addUsername" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="addEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="addPassword" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <input type="text" class="form-control" value="Admin" readonly>
                                <div class="form-text">This user will be created as an administrator</div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary">Create Admin</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search -->
        <div class="relative max-w-md">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400"></i>
            <input 
                type="text" 
                id="userSearch"
                placeholder="Search users..." 
                class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all"
            >
        </div>

        <!-- Users Table Container -->
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">User</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Joined</th>
                            <th class="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersList">
                        <!-- Users will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Summary -->
        <div id="summary" class="text-sm text-gray-500">
            <!-- Summary text will be injected here -->
        </div>
    </div>

    <script>
        // Mock Data
        // Data from Backend
        const users = JSON.parse('{{ users_json|escapejs }}');

        let searchQuery = '';

        // Initialize Icons
        function refreshIcons() {
            lucide.createIcons();
        }

        // Render Users
        function renderUsers() {
            const list = document.getElementById('usersList');
            const summary = document.getElementById('summary');
            
            const filteredUsers = users.filter(user =>
                user.username.toLowerCase().includes(searchQuery.toLowerCase()) ||
                user.email.toLowerCase().includes(searchQuery.toLowerCase())
            );

            list.innerHTML = filteredUsers.map(user => `
                <tr class="user-row border-b border-gray-100 last:border-0 transition-colors">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center">
                                <span class="text-sm font-bold text-blue-600">
                                    ${user.username.charAt(0).toUpperCase()}
                                </span>
                            </div>
                            <span class="font-medium text-gray-900">${user.username}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2 text-sm text-gray-500">
                            <i data-lucide="mail" class="h-4 w-4"></i>
                            ${user.email}
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        ${user.isAdmin ? `
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800">
                                <i data-lucide="shield" class="h-3 w-3 mr-1"></i>
                                Admin
                            </span>
                        ` : `
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-800">
                                User
                            </span>
                        `}
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">
                        <div class="flex items-center gap-2">
                            <i data-lucide="calendar" class="h-4 w-4"></i>
                            ${new Date(user.createdAt).toLocaleDateString()}
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="dropdown">
                            <button class="btn btn-link link-dark p-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i data-lucide="more-vertical" class="h-4 w-4 text-gray-500"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#" onclick="viewUser('${user.id}')">View Profile</a></li>
                                <li><a class="dropdown-item" href="#" onclick="editUser('${user.id}')">Edit User</a></li>
                                <li><a class="dropdown-item" href="#" onclick="toggleAdmin('${user.id}')">${user.isAdmin ? 'Remove Admin' : 'Make Admin'}</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" onclick="deleteUser('${user.id}')">Delete User</a></li>
                            </ul>
                        </div>
                    </td>
                </tr>
            `).join('');

            summary.textContent = `Showing ${filteredUsers.length} of ${users.length} users`;
            refreshIcons();
        }



        // Search Logic
        document.getElementById('userSearch').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderUsers();
        });

        // Initial Render
        renderUsers();

        // --- API & Interaction Logic ---

        // CSRF Token Helper
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // Add User
        document.querySelector('#addUserModal .btn-primary').addEventListener('click', async () => {
            const username = document.getElementById('addUsername').value;
            const email = document.getElementById('addEmail').value;
            const password = document.getElementById('addPassword').value;
            const role = 'admin'; // Always create as admin
            
            // Basic validation
            if(!username || !email || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Missing Fields',
                    text: 'Please fill in all fields',
                    confirmButtonColor: '#3085d6'
                });
                return;
            }

            try {
                const response = await fetch("{% url 'admin_add_user' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ username, email, password, role })
                });
                
                const data = await response.json();
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Admin Added',
                        text: 'The new admin has been created successfully.',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => location.reload());
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message,
                        confirmButtonColor: '#d33'
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'System Error',
                    text: 'An unexpected error occurred.',
                    confirmButtonColor: '#d33'
                });
            }
        });

        // Toggle Admin
        async function toggleAdmin(userId) {
            Swal.fire({
                title: 'Change Role?',
                text: "Are you sure you want to change this user's role?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, change it!'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`/admin-panel/users/${userId}/toggle-admin/`, {
                            method: 'POST',
                            headers: { 'X-CSRFToken': csrftoken }
                        });
                        const data = await response.json();
                        if(data.success) {
                             Swal.fire({
                                icon: 'success',
                                title: 'Updated!',
                                text: 'User role has been updated.',
                                showConfirmButton: false,
                                timer: 1500
                            }).then(() => location.reload());
                        } else {
                            Swal.fire('Error', data.message, 'error');
                        }
                    } catch (e) { 
                        console.error(e); 
                        Swal.fire('Error', 'Failed to update role', 'error');
                    }
                }
            });
        }

        // Delete User
        async function deleteUser(userId) {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`/admin-panel/users/${userId}/delete/`, {
                            method: 'POST',
                            headers: { 'X-CSRFToken': csrftoken }
                        });
                        const data = await response.json();
                        if(data.success) {
                            Swal.fire(
                                'Deleted!',
                                'User has been deleted.',
                                'success'
                            ).then(() => location.reload());
                        } else {
                            Swal.fire('Error', data.message, 'error');
                        }
                    } catch (e) { 
                        console.error(e); 
                        Swal.fire('Error', 'Failed to delete user', 'error');
                    }
                }
            });
        }

        // View User
        async function viewUser(userId) {
            try {
                const response = await fetch(`/admin-panel/users/${userId}/get/`);
                const data = await response.json();
                if(data.success) {
                    document.getElementById('viewUsername').textContent = data.user.username;
                    document.getElementById('viewEmail').textContent = data.user.email;
                    document.getElementById('viewRole').textContent = data.user.role;
                    document.getElementById('viewJoined').textContent = data.user.date_joined;
                    
                    const modal = new bootstrap.Modal(document.getElementById('viewUserModal'));
                    modal.show();
                } else {
                    Swal.fire('Error', 'Error loading user data', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'System error loading data', 'error');
            }
        }

        // Edit User
        async function editUser(userId) {
            try {
                const response = await fetch(`/admin-panel/users/${userId}/get/`);
                const data = await response.json();
                if(data.success) {
                    document.getElementById('editUserId').value = data.user.id;
                    document.getElementById('editUsername').value = data.user.username;
                    document.getElementById('editEmail').value = data.user.email;
                    
                    const modal = new bootstrap.Modal(document.getElementById('editUserModal'));
                    modal.show();
                } else {
                    Swal.fire('Error', 'Error loading user data', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'System error loading data', 'error');
            }
        }

        // Save Edit User
        document.getElementById('saveEditUserBtn').addEventListener('click', async () => {
            const userId = document.getElementById('editUserId').value;
            const username = document.getElementById('editUsername').value;
            const email = document.getElementById('editEmail').value;
            
            try {
                 const response = await fetch(`/admin-panel/users/${userId}/edit/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ username, email })
                });
                const data = await response.json();
                if(data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Saved',
                        text: 'User details updated successfully!',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => location.reload());
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            } catch (e) { 
                console.error(e); 
                Swal.fire('Error', 'Failed to update user', 'error');
            }
        });
    </script>
    <!-- Sidebar Logic -->
    <!-- Sidebar Logic handled in Sidebar.html -->
    </main>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
