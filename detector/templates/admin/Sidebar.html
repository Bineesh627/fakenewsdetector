    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <!-- Collapse Button -->
        <button id="sidebarToggle" class="toggle-btn" aria-label="Toggle Sidebar">
            <i class="bi bi-chevron-left" id="toggleIcon"></i>
        </button>

        <!-- Header -->
        <div class="sidebar-header">
            <a href="{% url 'admin_dashboard' %}" class="text-decoration-none d-flex align-items-center gap-3">
                <div class="logo-box">
                    <i class="bi bi-shield-check"></i>
                </div>
                <div class="brand-text">
                    <div class="fw-bold fs-6 text-dark">TruthGuard</div>
                    <div class="text-muted" style="font-size: 0.75rem;">Admin Panel</div>
                </div>
            </a>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
            <a href="{% url 'admin_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span class="link-text">Dashboard</span>
            </a>
            <a href="{% url 'admin_users' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}">
                <i class="bi bi-people"></i>
                <span class="link-text">Users</span>
            </a>
            <a href="{% url 'admin_predictions' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_predictions' %}active{% endif %}">
                <i class="bi bi-file-text"></i>
                <span class="link-text">Predictions</span>
            </a>
            <a href="{% url 'admin_feedback' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_feedback' %}active{% endif %}">
                <i class="bi bi-chat-square-text"></i>
                <span class="link-text">Feedback</span>
            </a>
            <a href="{% url 'admin_activity' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_activity' %}active{% endif %}">
                <i class="bi bi-activity"></i>
                <span class="link-text">Activity Logs</span>
            </a>
            <a href="{% url 'admin_settings' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_settings' %}active{% endif %}">
                <i class="bi bi-gear"></i>
                <span class="link-text">Settings</span>
            </a>
        </nav>

        <!-- User Section -->
        <div class="user-section">
            <div class="user-profile">
                <div class="avatar-circle">
                    <span id="userInitial">{{ request.user.username.0|upper }}</span>
                </div>
                <div class="user-info d-flex flex-column" style="min-width: 0;">
                    <span class="fw-medium text-dark text-truncate" id="userName">{{ request.user.username }}</span>
                    <span class="text-muted text-truncate" id="userEmail">{{ request.user.email }}</span>
                </div>
            </div>
            
            <form action="{% url 'logout' %}" method="post" class="w-100">
                {% csrf_token %}
                <button type="submit" class="logout-btn text-decoration-none w-100 border-0 bg-transparent text-start d-flex align-items-center" style="padding: 0;">
                    <i class="bi bi-box-arrow-right" style="width: 1.25rem; text-align: center;"></i>
                    <span class="logout-text ms-2" style="font-size: 0.875rem;">Logout</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- Sidebar Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const toggleBtn = document.getElementById('sidebarToggle');
            const toggleIcon = document.getElementById('toggleIcon');
            
            // Collapse Logic
            let isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            
            function updateSidebarState() {
                if (isCollapsed) {
                    sidebar.classList.add('collapsed');
                    if(mainContent) mainContent.classList.add('collapsed');
                    toggleIcon.classList.remove('bi-chevron-left');
                    toggleIcon.classList.add('bi-chevron-right');
                } else {
                    sidebar.classList.remove('collapsed');
                    if(mainContent) mainContent.classList.remove('collapsed');
                    toggleIcon.classList.remove('bi-chevron-right');
                    toggleIcon.classList.add('bi-chevron-left');
                }
            }

            // Initial State
            updateSidebarState();

            // Toggle Handler
            if(toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    isCollapsed = !isCollapsed;
                    localStorage.setItem('sidebarCollapsed', isCollapsed);
                    updateSidebarState();
                });
            }
        });
    </script>
