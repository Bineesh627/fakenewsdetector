<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .custom-select-content {
            display: none;
        }
        .custom-select-content.open {
            display: block;
        }

    </style>
    <!-- Sidebar CSS -->
     {% load static %}
    <link rel="stylesheet" href="{% static 'css/Sidebar.css' %}">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-gray-50 min-h-screen text-slate-900 font-sans">
    <!-- Sidebar -->
    <!-- Sidebar Component -->
    {% include 'admin/Sidebar.html' %}

    <main id="mainContent" class="main-content">

    <div class="max-w-5xl mx-auto p-4 md:p-8 space-y-6">
        <!-- Header -->
        <header>
            <h1 class="text-3xl font-bold tracking-tight">Activity Logs</h1>
            <p class="text-slate-500 mt-1">Monitor all system activity and user actions</p>
        </header>

        <!-- Filters Section -->
        <div class="flex flex-col sm:flex-row gap-4 items-center">
            <!-- Search Input -->
            <div class="relative flex-1 w-full max-w-md">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
                <input 
                    type="text" 
                    id="searchQuery"
                    placeholder="Search logs..." 
                    class="flex h-10 w-full rounded-md border border-slate-200 bg-white px-10 py-2 text-sm ring-offset-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
                >
            </div>

            <!-- Custom Select Dropdown -->
            <div class="relative w-full sm:w-[200px]">
                <button id="filterBtn" class="flex h-10 w-full items-center justify-between rounded-md border border-slate-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <div class="flex items-center gap-2">
                        <i data-lucide="filter" class="h-4 w-4"></i>
                        <span id="selectedFilterText">All Actions</span>
                    </div>
                    <i data-lucide="chevron-down" class="h-4 w-4 opacity-50"></i>
                </button>
                <div id="filterMenu" class="absolute z-50 mt-1 hidden w-full rounded-md border border-slate-200 bg-white p-1 shadow-lg">
                    <button class="filter-option w-full text-left px-8 py-1.5 text-sm hover:bg-slate-100 rounded-sm" data-value="all">All Actions</button>
                    <button class="filter-option w-full text-left px-8 py-1.5 text-sm hover:bg-slate-100 rounded-sm" data-value="prediction_created">Predictions</button>
                    <button class="filter-option w-full text-left px-8 py-1.5 text-sm hover:bg-slate-100 rounded-sm" data-value="vote_up">Votes</button>
                    <button class="filter-option w-full text-left px-8 py-1.5 text-sm hover:bg-slate-100 rounded-sm" data-value="feedback_submitted">Feedback</button>
                    <button class="filter-option w-full text-left px-8 py-1.5 text-sm hover:bg-slate-100 rounded-sm" data-value="user_login">Logins</button>
                </div>
            </div>
        </div>

        <!-- Activity Timeline Container -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div id="logsContainer" class="divide-y divide-slate-100">
                <!-- Logs will be injected here -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <p class="text-slate-500">No activity logs found matching your criteria.</p>
            </div>
        </div>

        <!-- Footer Stats -->
        <div id="logStats" class="text-sm text-slate-500">
            Showing 0 of 0 logs
        </div>
    </div>

    <script>
        // Backend Data
        const activityLogs = JSON.parse('{{ activity_json|escapejs }}');

        // Configuration
        const actionIcons = {
            prediction_created: 'file-text',
            vote_up: 'thumbs-up',
            vote_down: 'thumbs-down',
            feedback_submitted: 'message-square',
            user_login: 'log-in',
        };

        const actionColors = {
            prediction_created: 'bg-blue-50 text-blue-600',
            vote_up: 'bg-green-50 text-green-600',
            vote_down: 'bg-red-50 text-red-600',
            feedback_submitted: 'bg-orange-50 text-orange-600',
            user_login: 'bg-slate-100 text-slate-600',
        };

        // State
        let searchQuery = '';
        let filterAction = 'all';

        // DOM Elements
        const logsContainer = document.getElementById('logsContainer');
        const emptyState = document.getElementById('emptyState');
        const logStats = document.getElementById('logStats');
        const filterBtn = document.getElementById('filterBtn');
        const filterMenu = document.getElementById('filterMenu');
        const selectedFilterText = document.getElementById('selectedFilterText');
        const searchInput = document.getElementById('searchQuery');

        // Functions
        function renderLogs() {
            const filtered = activityLogs.filter(log => {
                const matchesSearch = log.details.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesFilter = filterAction === 'all' || log.action === filterAction;
                return matchesSearch && matchesFilter;
            });

            logsContainer.innerHTML = '';
            
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach((log, index) => {
                    const icon = actionIcons[log.action] || 'clock';
                    const colorClass = actionColors[log.action] || 'bg-slate-100 text-slate-600';
                    const date = new Date(log.createdAt).toLocaleString();
                    const actionName = log.action.replace('_', ' ');

                    const logEl = document.createElement('div');
                    logEl.className = 'p-4 hover:bg-slate-50 transition-colors animate-fade-in';
                    logEl.style.animationDelay = `${index * 50}ms`;
                    
                    logEl.innerHTML = `
                        <div class="flex items-start gap-4">
                            <div class="p-2 rounded-lg ${colorClass}">
                                <i data-lucide="${icon}" class="h-4 w-4"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-slate-900 font-medium">${log.details}</p>
                                <div class="flex items-center gap-3 mt-1.5 text-sm text-slate-500">
                                    <span class="flex items-center gap-1">
                                        <i data-lucide="clock" class="h-3 w-3"></i>
                                        ${date}
                                    </span>
                                    ${log.username ? `<span>by <span class="font-medium">${log.username}</span></span>` : ''}
                                </div>
                            </div>
                            <span class="inline-flex items-center rounded-full border border-slate-200 bg-slate-50 px-2.5 py-0.5 text-xs font-semibold text-slate-600 shrink-0 capitalize">
                                ${actionName}
                            </span>
                        </div>
                    `;
                    logsContainer.appendChild(logEl);
                });
            }

            logStats.textContent = `Showing ${filtered.length} of ${activityLogs.length} logs`;
            lucide.createIcons();
        }

        // Event Listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLogs();
        });

        filterBtn.addEventListener('click', () => {
            filterMenu.classList.toggle('hidden');
        });

        document.querySelectorAll('.filter-option').forEach(option => {
            option.addEventListener('click', (e) => {
                filterAction = e.target.getAttribute('data-value');
                selectedFilterText.textContent = e.target.textContent;
                filterMenu.classList.add('hidden');
                renderLogs();
            });
        });

        // Close dropdown when clicking outside
        window.addEventListener('click', (e) => {
            if (!filterBtn.contains(e.target) && !filterMenu.contains(e.target)) {
                filterMenu.classList.add('hidden');
            }
        });

        // Initial Render
        window.onload = () => {
            renderLogs();
            lucide.createIcons();
        };
    </script>
    <!-- Sidebar Logic -->
    <!-- Sidebar Logic handled in Sidebar.html -->
    </main>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
